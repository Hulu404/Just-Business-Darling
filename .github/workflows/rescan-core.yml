name: rescan-core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rescan_core
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rescan
          POSTGRES_PASSWORD: rescan
          POSTGRES_DB: rescan_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://rescan:rescan@127.0.0.1:5432/rescan_core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Types
        run: python -m mypy app
      - name: Migrations
        run: python -m alembic upgrade head
      - name: SQLite tests
        run: python -m pytest
      - name: PostgreSQL tests
        env:
          RESCAN_TEST_DATABASE_URL: postgresql+psycopg://rescan:rescan@127.0.0.1:5432/rescan_core
        run: python -m pytest --cov=app --cov-report=term-missing
