name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # PostgreSQL-сервис: миграции и тесты гоняем на реальной СУБД, как в проде.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rescan
          POSTGRES_PASSWORD: rescan
          POSTGRES_DB: rescan_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://rescan:rescan@127.0.0.1:5432/rescan_core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy app
      - name: Migrations
        run: alembic upgrade head
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing
