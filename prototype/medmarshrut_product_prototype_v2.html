    function routeByChannel(){
      const c = {private:['Платный приём', 'Выберите специалиста, филиал и доступное время в расписании клиники.'], dms:['Приём по ДМС', 'Проверьте, входит ли услуга в вашу программу и нужно ли согласование со страховой.'], oms:['Маршрут по ОМС', 'Уточните порядок обращения через поликлинику и необходимость направления.']}[state.channel];
      return `<h3>${c[0]}</h3><p>${c[1]}</p><ol class="routeSteps"><li><b>1</b><span>Уточните подходящий формат консультации.</span></li><li><b>2</b><span>Выберите запись или передайте запрос координатору.</span></li><li><b>3</b><span>Возьмите документы и выжимку для врача.</span></li></ol><div class="actions">${btn('Выбрать время', 'bookOwn')}</div>`;
    }
    function result(){
      if (!state.routeCreated) return `<div class="empty"><h2>Маршрут пока не составлен</h2>${btn('Начать обращение', 'new')}</div>`;
      if (state.redflag) return `<div class="eyebrow">Проверка срочности</div><h1>Обратитесь за срочной помощью</h1><div class="note red"><strong>Вы отметили тревожный признак.</strong> Не ожидайте плановой записи через сервис. Позвоните 103 или 112 для получения экстренной помощи.</div><div class="actions"><a class="btn danger" href="tel:103">Позвонить 103</a><a class="btn secondary" href="tel:112">Позвонить 112</a>${navBtn('Исправить ответ', 'intake', 'ghost')}</div><div class="note" style="margin-top:25px">Это демонстрационный экран. Прототип не оценивает симптомы и не должен использоваться для принятия решений о здоровье.</div>`;
      return `<div class="pagehead"><div><div class="eyebrow">Персональный план обращения</div><h1>Ваш МедМаршрут</h1><p>По обращению «${safe((scenarios[state.scenario] || scenarios.symptoms).title)}»</p></div><div class="actions">${btn('Скопировать для врача', 'copySummary', 'secondary')}</div></div>
        <div class="resulttop"><div class="resultmain"><div class="eyebrow">Следующий шаг</div><strong class="big">${state.scenario === 'after' ? 'Уточнить план у лечащего врача' : 'Начать с консультации терапевта'}</strong><p style="margin:13px 0 0">Прототип показывает пример маршрута. В рабочем продукте этот вывод потребует медицинской проверки и правил клиники.</p><div class="actions">${btn('Посмотреть запись →', 'bookOwn')}${navBtn('Открыть мой план', 'plan', 'secondary')}</div></div>
          <div class="panel"><div class="eyebrow">По вашему обращению</div><div class="miniRow"><span>Возраст</span><strong>${state.age === 'child' ? 'Ребёнок' : 'Взрослый'}</strong></div><div class="miniRow"><span>Началось</span><strong>${safe(state.duration || 'Не указано')}</strong></div><div class="miniRow"><span>Город</span><strong>${safe(state.city || 'Не указан')}</strong></div><div class="miniRow"><span>Документ</span><strong>${safe(state.documentName || 'Нет')}</strong></div><div class="actions">${navBtn('Изменить ответы', 'intake', 'ghost small')}</div></div></div>
        <div class="sectionhead"><h2>Как можно обратиться</h2><span class="muted">Выберите удобный канал</span></div>
        <div class="tabs">${[['private', 'Платно'], ['dms', 'ДМС'], ['oms', 'ОМС']].map(([id, label]) => `<button class="tab ${state.channel === id ? 'active' : ''}" data-channel="${id}">${label}</button>`).join('')}</div>
        <div class="grid two"><div class="panel">${routeByChannel()}</div><div class="panel"><h3>Если записи нет</h3><p>Проверьте другой филиал, клинику-партнёра или формат консультации. Если доступные даты вам не подходят, передайте обращение координатору клиники.</p><div class="actions">${btn('Что делать без записи', 'noSlots', 'secondary')}</div></div></div>
        <div class="sectionhead"><h2>Подготовка к приёму</h2></div>
        <div class="grid three"><div class="card"><h3>Что взять</h3><p>Оригиналы анализов и выписок, список принимаемых лекарств, прошлые заключения по этой теме.</p></div><div class="card"><h3>Что спросить</h3><p>Какой следующий шаг? Нужно ли наблюдение? Когда повторно обращаться при изменении состояния?</p></div><div class="card"><h3>Для врача</h3><p>Краткая выжимка ваших ответов и документов. Перед отправкой её можно проверить.</p><div class="cardfoot">${btn('Посмотреть выжимку →', 'summary', 'ghost small')}</div></div></div>
        <div class="note warn" style="margin-top:20px">В этом прототипе медицинская логика демонстрационная. Он не оценивает симптомы и не должен использоваться для принятия решений о здоровье.</div>`;
    }
    function summaryText(){
      return `МедМаршрут — выжимка для врача\nСитуация: ${(scenarios[state.scenario] || scenarios.symptoms).title}\nСо слов пациента: ${state.symptoms || 'не указано'}\nНачало: ${state.duration || 'не указано'}\nВозрастная группа: ${state.age === 'child' ? 'ребёнок' : 'взрослый'}\nДокумент: ${state.documentName || 'не добавлен'}\nЗаметки: ${state.documentNotes || 'нет'}\nПредпочтительный канал: ${{private:'платно', dms:'ДМС', oms:'ОМС'}[state.channel]}\nТревожный признак отмечен: ${state.redflag ? 'да' : 'нет'}\nДанные введены пациентом; требуют проверки врачом.`;
    }
    /* Обращение из анкеты становится таким же эпизодом, как маршрут после исследования */
    function createOwnEpisode(){
      state.episodes = state.episodes.filter(e => e.id !== 'own');
      const sc = scenarios[state.scenario] || scenarios.symptoms;
      const e = {id:'own', patient:'Демо-пациент', mine:true, kind:'intake', title:'Обращение: ' + lc(sc.title), opened:'Только что', status:'active', reason:'', ruleId:'own', profile:[state.age === 'child' ? 'Ребёнок' : 'Взрослый', {private:'Платный приём', dms:'Полис ДМС', oms:'Полис ОМС'}[state.channel], 'Город: ' + (state.city || 'не указан')], steps:[], log:[]};
      addLog(e, 'Пациент', 'Обращение заполнено в личном кабинете');
      if (state.redflag){ e.status = 'manual_review'; e.urgent = true; e.reason = 'Пациент отметил тревожный признак: показан экран срочной помощи'; addLog(e, 'Маршрутизатор', e.reason); }
      else { mkStep(e, state.scenario === 'after' ? 'attending' : 'gp', 1, 'Демо-маршрут из анкеты', ''); addLog(e, 'Маршрутизатор', 'Предложен демонстрационный маршрут: ' + lc(title(e.steps[0]))); }
      state.episodes.unshift(e);
    }

    /* =====================================================================
       Экраны сотрудника клиники (часть из них видит и врач)
       ===================================================================== */
    const S_STATUS = {open:['Не записан','orange'], offered:['Предложена запись','blue'], confirmed:['Записан',''], attended:['Ждёт итога врача','blue'], completed:['Выполнено','gray'], refused:['Отложен пациентом','red'], superseded:['Заменён','gray']};
    const REF_FLOW = ['Ожидает записи', 'Записан у партнёра', 'Услуга оказана', 'Результат получен'];
    const who = f => f === 'staff' ? 'Наталья, координатор' : 'Врач';

    function nextStepLabel(e){
      if (e.status === 'manual_review') return e.suggest && e.suggest.length ? 'Вариант: ' + e.suggest.map(sv => lc(SERVICES[sv].title)).join(' и ') : 'Нужен план врача';
      const s = currentStep(e);
      return s ? title(s) : '—';
    }
    function inbox(){
      const all = state.episodes.map(e => [e, queueInfo(e)]);
      const tab = state.sel.inboxTab;
      const shown = all.filter(([, q]) => tab === 'all' || (tab === 'need' && q.need) || (tab === 'calm' && !q.need));
      const count = fn => all.filter(([e, q]) => fn(e, q)).length;
      return `<div class="pagehead"><div><div class="eyebrow">${state.role === 'doctor' ? 'Обращения клиники' : 'Рабочее место координатора'}</div><h1>Обращения</h1><p>После каждого подтверждённого заключения здесь появляется обращение с рекомендованным следующим шагом. Видно, что мешает пациенту дойти до записи.</p></div></div>
        <div class="grid four" style="margin-bottom:18px">
          <div class="card"><div class="metric">${count((e, q) => q.need)}</div><span class="muted">ждут действия</span></div>
          <div class="card"><div class="metric">${count((e, q) => q.group === 'offer')}</div><span class="muted">пациент не записан</span></div>
          <div class="card"><div class="metric">${count(e => e.status === 'manual_review') + count((e, q) => q.group === 'outcome')}</div><span class="muted">ждут решения врача</span></div>
          <div class="card"><div class="metric">${count((e, q) => q.label === 'Просрочено' || q.label === 'Отложено')}</div><span class="muted">просрочено или отложено</span></div>
        </div>
        <div class="tabs">${[['need', 'Ждут действия'], ['calm', 'Идут по плану'], ['all', 'Все']].map(([id, label]) => `<button class="tab ${tab === id ? 'active' : ''}" data-action="inboxTab" data-id="${id}">${label}</button>`).join('')}</div>
        <div class="tablewrap"><table><thead><tr><th>Пациент</th><th>Исследование или обращение</th><th>Следующий шаг</th><th>Что мешает</th><th>Статус</th><th></th></tr></thead><tbody>
          ${shown.map(([e, q]) => `<tr><td><strong>${safe(e.patient)}</strong>${e.mine ? '<small>из личного кабинета</small>' : ''}</td><td>${safe(e.title)}<small>${safe(e.opened)}</small></td><td>${safe(nextStepLabel(e))}</td><td>${safe(q.reason)}</td><td>${badge(q.label, q.tone)}</td><td><button class="btn secondary small" data-case="${e.id}">Открыть</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">В этом разделе пусто.</td></tr>'}
        </tbody></table></div>
        <div class="note" style="margin-top:17px">Тест: в режиме пациента запишитесь на приём, отложите шаг или заполните новое обращение, затем вернитесь сюда. Статус и причина изменятся.</div>`;
    }

    /* ---------- Карточка обращения ---------- */
    function sourceBlock(e){
      if (e.kind === 'intake'){
        return `<div class="panel"><h3>Исходные сведения</h3><div class="miniRow"><span>Описание</span><strong style="max-width:65%">${safe(state.symptoms || 'Не указано')}</strong></div><div class="miniRow"><span>Срок</span><strong>${safe(state.duration || 'Не указан')}</strong></div><div class="miniRow"><span>Документ</span><strong>${safe(state.documentName || 'Нет')}</strong></div><div class="miniRow"><span>Предпочтение</span><strong>${{private:'Платно', dms:'ДМС', oms:'ОМС'}[state.channel]}</strong></div></div>`;
      }
      const st = studyOf(e), d = DEMO[st.kind], res = analyze(st.conclusion, d.modality);
      return `<div class="panel"><h3>Заключение по исследованию</h3><p style="margin-bottom:12px">${d.title} · ${lc(safe(st.date))}</p>
        <div class="chips" style="margin-bottom:12px"><span class="chip">Черновик: <b>${st.uploaded ? 'ИИ-модель сервиса, снимок загрузил пациент' : 'ИИ-сервис «Третье мнение», демо'}</b></span><span class="chip">Подтвердил: <b>${safe(st.confirmedBy)}</b></span>${st.edited ? '<span class="chip">Черновик <b>исправлен врачом</b></span>' : ''}</div>
        <div class="quote">${highlight(st.conclusion)}</div>
        <div class="tlgroup" style="margin-top:16px">Что извлечено из текста</div><div class="chips">${res.facts.map(([k, v]) => `<span class="chip">${k}: <b>${safe(v)}</b></span>`).join('')}</div>
        <div class="actions">${btn('Открыть снимок и черновик ИИ', 'studyOpen', 'ghost small', {id:st.id})}</div></div>`;
    }
    function recBlock(e){
      if (e.kind === 'intake'){
        return `<div class="panel"><h3>Предложенный маршрут</h3><p style="margin:0">${e.urgent ? 'Пациент отметил тревожный признак. Система показала экран срочного обращения.' : 'Демонстрационный вариант: первичная консультация терапевта. При необходимости маршрут меняет врач.'}</p></div>`;
      }
      if (e.status === 'manual_review'){
        const req = state.requests.find(r => r.episodeId === e.id && r.kind === 'route' && r.status === 'open');
        const has = e.suggest && e.suggest.length;
        const acts = state.role === 'doctor' ? (has ? btn('Подтвердить маршрут', 'routeOk', '', {id:e.id}) : '') + btn('Задать свой план', 'planOpen', 'secondary', {id:e.id}) : req ? btn('Открыть запрос врачу', 'reqOpen', 'secondary', {id:req.id}) : btn('Запросить решение врача', 'askDoctor', '', {id:e.id});
        return `<div class="panel"><h3>Рекомендация следующего шага</h3><div class="note warn">${safe(e.reason)}</div>${has ? `<p style="margin:14px 0 0">Вариант маршрутизатора: <strong style="color:var(--ink)">${e.suggest.map(sv => lc(SERVICES[sv].title)).join(' и ')}</strong>. Пациент увидит план только после решения врача.</p>` : ''}<div class="actions">${acts}</div></div>`;
      }
      const cycle = e.steps.length ? Math.max(...e.steps.map(s => s.cycle)) : 1;
      const last = e.steps.filter(s => s.cycle === cycle && s.status !== 'superseded');
      const rule = RULES.find(r => r.id === e.ruleId);
      const by = last[0] ? last[0].by : '';
      const alt = last[0] && slotsFor(last[0].service).find(x => x.partner);
      const head = last.length > 1 ? `<ul class="steplist">${last.map(s => `<li>${title(s)}<span>${safe(s.due || 'по плану')}</span></li>`).join('')}</ul>` : `<strong style="font-size:21px;line-height:1.3;display:block">${last.map(title).join('') || 'Шагов нет'}</strong>`;
      return `<div class="panel"><h3>Рекомендация следующего шага</h3>${head}
        <dl class="kv" style="margin-top:14px">${last.length > 1 ? '' : `<dt>Срок</dt><dd>${safe((last[0] && last[0].due) || (rule && rule.due) || 'по плану')}</dd>`}<dt>Основание</dt><dd>${safe(by)}${by.startsWith('Правило') ? ' · утверждено клиникой' : ''}</dd><dt>Учтено из карты</dt><dd>${e.profile.map(safe).join(' · ')}</dd><dt>Если нет времени</dt><dd>${alt ? `${PARTNERS[alt.partner].name}: ${lc(alt.date)}, ${alt.time}` : 'Другой филиал или помощь координатора'}</dd></dl>
        <p class="muted" style="margin:14px 0 0;font-size:13.5px">Срок задаёт правило клиники или врач. Оценка модели на срочность не влияет.</p></div>`;
    }
    function staffStep(e, s, isCur, isLast){
      const partnerWait = s.status === 'attended' && s.slot && s.slot.partner;
      const [lab, tone] = s.overdue && live(s) ? ['Просрочено', 'red'] : partnerWait ? ['Ждём результат партнёра', 'blue'] : S_STATUS[s.status];
      const dot = s.status === 'completed' ? `<span class="dot done">${icon('check')}</span>` : `<span class="dot ${s.status === 'refused' || s.overdue ? 'bad' : isCur ? 'now' : ''}"></span>`;
      const meta = [];
      if (s.slot) meta.push(safe(slotFull(s.slot)));
      if (s.due && !s.slot) meta.push((s.overdue ? 'Срок прошёл ' : 'Срок: ') + safe(s.due));
      meta.push('Кто назначил: ' + safe(lc(s.by)));
      if (s.outcome) meta.push('Итог: ' + safe(s.outcome));
      return `<div class="tlitem ${isLast ? 'last' : ''}">${dot}<div><div class="tlhead"><strong>${title(s)}</strong>${badge(lab, tone)}${whereBadge(s)}</div><div class="tlmeta">${meta.join('<br>')}</div></div></div>`;
    }
    function planBlock(e){
      const shown = e.steps, cur = currentStep(e);
      let rows = `<div class="tlitem ${shown.length ? '' : 'last'}"><span class="dot done">${icon('check')}</span><div><div class="tlhead"><strong>${e.kind === 'imaging' ? 'Заключение подтверждено врачом' : 'Обращение из личного кабинета'}</strong></div><div class="tlmeta">${safe(e.opened)}</div></div></div>`;
      let cycle = 0;
      shown.forEach((s, i) => {
        if (s.cycle !== cycle){ cycle = s.cycle; rows += `<div class="tlgroup">Цикл ${cycle} · ${cycle === 1 ? 'после заключения' : 'после итога приёма'}</div>`; }
        rows += staffStep(e, s, cur === s, i === shown.length - 1);
      });
      return `<div class="panel"><h3 style="margin-bottom:16px">План и шаги</h3>${rows}</div>`;
    }
    function staffActions(e){
      const s = currentStep(e), q = queueInfo(e), key = s ? refKey(e, s) : '';
      let b = '';
      if (e.status === 'manual_review'){
        const req = state.requests.find(r => r.episodeId === e.id && r.kind === 'route' && r.status === 'open');
        b = e.urgent ? '' : req ? btn('Открыть запрос врачу', 'reqOpen', '', {id:req.id}) : btn('Запросить решение врача', 'askDoctor', '', {id:e.id});
      } else if (e.status === 'paused' && s){
        b = btn('Предложить другое время', 'slotList', '', {key, mode:'offer'}) + btn('Вернуть в работу', 'reopen', 'secondary', {key}) + btn('Остановить сопровождение', 'stopEp', 'ghost', {id:e.id});
      } else if (s && s.status === 'open'){
        b = btn('Предложить время', 'slotList', '', {key, mode:'offer'}) + btn('Записать по звонку', 'slotList', 'secondary', {key, mode:'staff'});
      } else if (s && s.status === 'offered'){
        b = btn('Записать по звонку', 'slotList', '', {key, mode:'staff'}) + btn('Предложить другое время', 'slotList', 'secondary', {key, mode:'offer'});
      } else if (s && s.status === 'confirmed'){
        b = (s.slot.partner ? btn('Услуга у партнёра оказана', 'refStep', '', {key}) : btn('Визит состоялся', 'attend', '', {key})) + btn('Отменить запись', 'unbook', 'secondary', {key});
      } else if (s && s.status === 'attended'){
        b = s.slot && s.slot.partner ? btn('Результат от партнёра получен', 'refStep', '', {key}) : btn('Напомнить врачу про итог', 'nudgeDoctor', '', {id:e.id});
      } else if (!s && e.status === 'active'){
        b = btn('Запросить решение врача', 'askDoctor', '', {id:e.id});
      }
      const done = ['completed', 'closed'].includes(e.status);
      return `<div class="panel"><h3>Что сделать сейчас</h3><p>${safe(q.reason)}</p><div class="actions">${b}${done ? '' : btn('Написать пациенту', 'writeOpen', 'secondary', {id:e.id})}</div></div>`;
    }
    function doctorActions(e){
      const s = e.steps.find(x => ['attended', 'confirmed'].includes(x.status) && !(x.slot && x.slot.partner));
      let b = '', text = 'Маршрутизатор только предлагает шаг. План меняет врач.';
      if (e.urgent){ text = 'Пациент отметил тревожный признак и увидел экран срочной помощи.'; }
      else if (e.status === 'manual_review'){
        text = e.reason;
        b = (e.suggest && e.suggest.length ? btn('Подтвердить маршрут', 'routeOk', '', {id:e.id}) : '') + btn('Задать свой план', 'planOpen', e.suggest && e.suggest.length ? 'secondary' : '', {id:e.id});
      } else if (s){
        text = s.status === 'attended' ? 'Визит состоялся. Внесите итог: от него зависят следующие шаги.' : `Пациент записан: ${lc(slotLine(s.slot))}.`;
        b = btn('Внести итог приёма', 'planOpen', '', {id:e.id, step:s.id});
      } else if (!['completed', 'closed'].includes(e.status)){
        b = btn('Изменить план', 'planOpen', 'secondary', {id:e.id});
      }
      return `<div class="panel"><h3>Решение врача</h3><p>${safe(text)}</p><div class="actions">${b}${btn('Написать координатору', 'reqNew', 'secondary', {id:e.id})}</div></div>`;
    }
    function casePage(){
      const e = ep(state.sel.episode) || state.episodes[0];
      const q = queueInfo(e);
      const sent = state.outbox.filter(o => o.episodeId === e.id).slice(0, 3);
      const reqs = state.requests.filter(r => r.episodeId === e.id);
      return `<div class="pagehead"><div><div class="eyebrow">Карточка обращения</div><h1>${safe(e.patient)}</h1><p>${safe(e.title)} · открыто ${lc(safe(e.opened))}</p></div><div class="actions">${badge(q.label, q.tone)}${navBtn('← К очереди', 'inbox', 'secondary')}</div></div>
        <div class="twocol"><div class="stack">${sourceBlock(e)}${recBlock(e)}${planBlock(e)}</div>
          <div class="stack">${state.role === 'doctor' ? doctorActions(e) : staffActions(e)}
            <div class="panel"><h3>Связь</h3>${sent.length ? sent.map(o => `<div class="rowline"><div><strong>${safe(o.event)}</strong><div class="meta">Пациенту · ${safe(o.t)} · ${safe(o.channel)}</div></div>${badge(o.status, o.status.startsWith('Прочитано') ? '' : 'gray')}</div>`).join('') : '<p>Пациенту пока ничего не отправляли.</p>'}
              ${reqs.map(r => `<div class="rowline"><div><strong>${safe(r.subject)}</strong><div class="meta">${r.from === 'staff' ? 'Запрос врачу' : 'Запрос от врача'} · ${safe(r.t)}</div></div><button class="btn ghost small" data-action="reqOpen" data-id="${r.id}">${r.status === 'closed' ? 'Закрыт' : 'Открыть'}</button></div>`).join('')}</div>
            <div class="panel"><h3>Журнал</h3><div class="log">${e.log.slice().reverse().map(l => `<div><time>${safe(l.t)}</time><span><b>${safe(l.who)}.</b> ${safe(l.text)}</span></div>`).join('')}</div></div>
            <div class="note">Действия в демо меняют статус обращения. Звонки и настоящие сообщения не выполняются.</div></div></div>`;
    }
    function slotListModal(key, mode){
      const [e, s] = byKey(key);
      openModal(`${modalHead(mode === 'offer' ? 'Предложить время пациенту' : 'Записать по звонку', title(s))}<p>${safe(e.patient)} · срок: ${safe(s.due || 'по плану')}</p>
        ${slotsFor(s.service).map(x => `<div class="slot"><div><strong>${x.date}, ${x.time}</strong><div>${x.who}</div><div class="meta">${x.place} · ${x.format}</div>${x.partner ? `<div style="margin-top:6px">${badge('Клиника-партнёр', 'violet')}</div>` : ''}</div><div class="slotprice">${x.price}</div>${btn('Выбрать', 'slotAsk', 'small', {key, slot:x.id, mode})}</div>`).join('')}`, true);
    }
    function writeModal(id){
      const e = ep(id), s = currentStep(e);
      const text = !s ? 'Здравствуйте! Это Наталья из клиники «Линия здоровья». ' : s.status === 'confirmed' ? `Здравствуйте! Это Наталья из клиники «Линия здоровья». Напоминаю о записи: ${lc(title(s))}, ${lc(slotLine(s.slot))}.` : `Здравствуйте! Это Наталья из клиники «Линия здоровья». Напоминаю про следующий шаг: ${lc(title(s))}${s.due ? ', срок ' + s.due : ''}. Могу записать вас сама: напишите, когда удобно.`;
      openModal(`${modalHead('Связь с пациентом', safe(e.patient))}<div class="field"><label for="wrText">Сообщение</label><textarea id="wrText">${safe(text)}</textarea><small>Канал подберётся по настройкам пациента: приложение, SMS или мессенджер.</small></div><div class="actions">${btn('Отправить', 'writeSend', '', {id})}${btn('Отмена', 'close', 'secondary')}</div>`);
    }

    /* ---------- Запись и сопровождение ---------- */
    function scheduling(){
      const cols = [['offer', 'Предложить запись'], ['wait', 'Ждём ответ пациента'], ['booked', 'Записаны'], ['outcome', 'Ждём итог врача'], ['lost', 'Просрочено и на разборе']];
      const all = state.episodes.map(e => [e, queueInfo(e)]);
      return `<div class="pagehead"><div><div class="eyebrow">Операционная работа</div><h1>Запись и сопровождение</h1><p>Каждое обращение стоит в колонке того действия, которого от него ждут.</p></div></div>
        <div class="board">${cols.map(([g, label]) => { const items = all.filter(([, q]) => q.group === g); return `<div class="col"><h3>${label}<span>${items.length}</span></h3>${items.map(([e, q]) => `<button class="kcard" data-case="${e.id}"><strong>${safe(e.patient)}</strong><span style="color:var(--ink)">${safe(nextStepLabel(e))}</span><span>${safe(q.reason)}</span>${badge(q.label, q.tone)}</button>`).join('') || '<div class="colempty">Пусто</div>'}</div>`; }).join('')}</div>
        <div class="sectionhead"><h2>Контроль сопровождения</h2></div>
        <div class="panel"><ol class="routeSteps"><li><b>1</b><span>Проверить рекомендацию и доступность слотов в клинике и у партнёров.</span></li><li><b>2</b><span>Предложить запись или согласовать альтернативу с пациентом.</span></li><li><b>3</b><span>Убедиться, что врач получил выжимку до приёма.</span></li><li><b>4</b><span>После визита дождаться итога врача и записать пациента на следующий шаг.</span></li></ol></div>`;
    }

    /* ---------- Связь врач — клиника (общий экран для двух ролей) ---------- */
    function requests(){
      const me = state.role === 'doctor' ? 'doctor' : 'staff';
      const list = state.requests;
      const cur = list.find(r => r.id === state.sel.request) || list[0];
      const mark = r => r.status === 'closed' ? badge('Закрыт', 'gray') : waitingOn(r) === me ? badge('Ждёт вашего ответа', 'orange') : badge(me === 'staff' ? 'Ждём врача' : 'Ждём клинику', 'blue');
      const e = cur && ep(cur.episodeId);
      let quick = '';
      if (cur && cur.status === 'open' && e){
        if (me === 'doctor' && e.status === 'manual_review') quick = (e.suggest && e.suggest.length ? btn('Подтвердить маршрут', 'routeOk', 'small', {id:e.id}) : '') + btn('Задать свой план', 'planOpen', 'secondary small', {id:e.id});
        if (me === 'staff' && cur.kind === 'book') quick = `<button class="btn small" data-case="${e.id}">Перейти к записи</button>`;
      }
      const thread = !cur ? '<div class="panel empty"><h3>Запросов пока нет</h3></div>' : `<div class="panel"><div class="pagehead" style="margin-bottom:14px"><div>${mark(cur)}<h2 style="margin-top:11px">${safe(cur.subject)}</h2><p style="margin:0">${e ? `<button class="linkbtn" data-case="${e.id}">${safe(e.patient)} · ${safe(e.title)}</button>` : ''}</p></div></div>
          <div class="chat">${cur.msgs.map(m => `<div class="msg ${m.from === me ? 'me' : ''}"><div class="when">${m.from === me ? 'Вы' : who(m.from)} · ${safe(m.t)}</div><p>${safe(m.text)}</p></div>`).join('')}</div>
          ${quick ? `<div class="actions">${quick}</div>` : ''}
          ${cur.status === 'open' ? `<div class="composer"><input id="reqText" placeholder="Ответить" autocomplete="off">${btn('Отправить', 'reqSend', '', {id:cur.id})}</div><div class="actions" style="margin-top:12px">${btn('Закрыть запрос', 'reqClose', 'ghost small', {id:cur.id})}</div>` : '<div class="note" style="margin-top:16px">Запрос закрыт. Переписка осталась в журнале обращения.</div>'}</div>`;
      return `<div class="pagehead"><div><div class="eyebrow">Сервис «Врач — клиника»</div><h1>${me === 'doctor' ? 'Связь с клиникой' : 'Связь с врачами'}</h1><p>${me === 'doctor' ? 'Координаторы просят подтвердить маршрут или уточнить заключение. Вы передаёте им, кого и куда записать.' : 'Врач подтверждает маршрут и передаёт, кого записать после приёма. Каждый запрос привязан к обращению.'}</p></div><div class="actions">${btn(icon('plus') + 'Новый запрос', 'reqNew')}</div></div>
        <div class="split"><div>${list.map(r => { const ee = ep(r.episodeId); return `<button class="reqitem ${cur && r.id === cur.id ? 'active' : ''}" data-action="reqOpen" data-id="${r.id}">${mark(r)}<strong>${safe(r.subject)}</strong><span class="sub">${safe(ee ? ee.patient : '')} · ${r.from === me ? 'от вас' : 'от ' + (r.from === 'staff' ? 'координатора' : 'врача')} · ${safe(r.t)}</span></button>`; }).join('')}</div>${thread}</div>`;
    }
    function reqNewModal(id){
      const me = state.role === 'doctor' ? 'doctor' : 'staff';
      const topics = me === 'doctor' ? ['Записать пациента', 'Нужен слот у партнёра', 'Позвонить пациенту', 'Другое'] : ['Подтвердить маршрут', 'Уточнить заключение', 'Перенести приём', 'Другое'];
      const open = state.episodes.filter(e => !['completed', 'closed'].includes(e.status));
      openModal(`${modalHead('Сервис «Врач — клиника»', me === 'doctor' ? 'Запрос координаторам' : 'Запрос врачу')}
        <div class="field"><label for="rqEp">Обращение</label><select id="rqEp">${open.map(e => `<option value="${e.id}" ${e.id === id ? 'selected' : ''}>${safe(e.patient)} · ${safe(e.title)}</option>`).join('')}</select></div>
        <div class="field" style="margin-top:14px"><label for="rqTopic">Тема</label><select id="rqTopic">${topics.map(t => `<option>${t}</option>`).join('')}</select></div>
        <div class="field" style="margin-top:14px"><label for="rqText">Что нужно</label><textarea id="rqText" placeholder="Коротко и по делу"></textarea></div>
        <div class="actions">${btn('Отправить', 'reqCreate')}${btn('Отмена', 'close', 'secondary')}</div>`);
    }

    /* ---------- Связь клиника — пациент ---------- */
    function comms(){
      const o = state.outbox;
      const today = o.filter(x => /Сегодня|Только что/.test(x.t)).length;
      const read = o.filter(x => x.status.startsWith('Прочитано')).length;
      const silent = o.filter(x => /ответа нет/.test(x.status)).length;
      return `<div class="pagehead"><div><div class="eyebrow">Сервис «Клиника — пациент»</div><h1>Связь с пациентами</h1><p>Сообщения уходят сами, когда в обращении что-то меняется. Если пациент молчит, задача переходит координатору.</p></div></div>
        <div class="grid three" style="margin-bottom:18px"><div class="card"><div class="metric">${today}</div><span class="muted">отправлено сегодня</span></div><div class="card"><div class="metric">${read} из ${o.length}</div><span class="muted">прочитано</span></div><div class="card"><div class="metric">${silent}</div><span class="muted">без ответа: нужен звонок</span></div></div>
        <div class="tablewrap"><table><thead><tr><th>Когда</th><th>Пациент</th><th>Событие</th><th>Канал</th><th>Статус</th></tr></thead><tbody>
          ${o.map(x => `<tr><td>${safe(x.t)}</td><td>${x.episodeId ? `<button class="linkbtn" data-case="${x.episodeId}">${safe(x.patient)}</button>` : `<strong>${safe(x.patient)}</strong>`}</td><td>${safe(x.event)}</td><td>${safe(x.channel)}</td><td>${badge(x.status, x.status.startsWith('Прочитано') ? '' : /ответа нет/.test(x.status) ? 'orange' : 'gray')}</td></tr>`).join('')}
          </tbody></table></div>
        <div class="sectionhead"><h2>Когда пишем пациенту</h2><span class="muted">Сценарии можно выключить</span></div>
        <div class="trig">${TRIGGERS.map(([id, ev, when, what]) => `<label class="checkline"><input type="checkbox" data-trigger="${id}" ${state.triggers[id] ? 'checked' : ''}><span><strong>${ev}</strong> · ${when}<br><span class="muted">${what}</span></span></label>`).join('')}</div>
        <div class="note" style="margin-top:16px">Пациент сам выбирает канал и тихие часы. Текст заключения в SMS и мессенджеры не уходит: там только ссылка в личный кабинет.</div>`;
    }

    /* ---------- Партнёры ---------- */
    function partners(){
      const tab = state.sel.partnersTab;
      const refs = state.referrals;
      let body = '';
      if (tab === 'clinics'){
        body = `<div class="grid two">${Object.entries(PARTNERS).map(([id, p]) => `<div class="card"><div class="tile violet">${icon('link')}</div><h3>${p.name}</h3><p>${p.services}</p><dl class="kv" style="margin-top:14px"><dt>Обмен данными</dt><dd>${p.exchange}</dd><dt>До записи</dt><dd>в среднем ${p.wait}</dd><dt>Направлено за месяц</dt><dd>${p.sent}</dd><dt>Вернулись к нам</dt><dd>${p.back}</dd></dl></div>`).join('')}</div>`;
      } else if (tab === 'refs'){
        body = `<div class="tablewrap"><table><thead><tr><th>Пациент</th><th>Услуга</th><th>Партнёр</th><th>Статус</th><th></th></tr></thead><tbody>${refs.map(r => { const i = REF_FLOW.indexOf(r.status); const next = ['Записать у партнёра', 'Услуга оказана', 'Результат получен'][i]; return `<tr><td>${r.episodeId ? `<button class="linkbtn" data-case="${r.episodeId}">${safe(r.patient)}</button>` : `<strong>${safe(r.patient)}</strong>`}</td><td>${SERVICES[r.service].title}</td><td>${PARTNERS[r.partner].name}</td><td>${badge(r.status, i === 3 ? 'gray' : i === 0 ? 'orange' : 'blue')}</td><td>${next ? btn(next, 'refAdvance', 'secondary small', {id:r.id}) : ''}</td></tr>`; }).join('')}</tbody></table></div><div class="note" style="margin-top:16px">Пациент не выпадает из плана: когда партнёр присылает результат, шаг закрывается, а врач клиники получает запрос на следующий шаг.</div>`;
      } else {
        body = `<div class="grid three">${PHARMACIES.map(x => `<div class="card"><div class="tile">${icon('pharmacy')}</div><h3>${x.name}</h3><p>${x.addr} · ${x.dist}</p><dl class="kv" style="margin-top:14px"><dt>Наличие</dt><dd>Обновляется через API</dd><dt>Рецепты</dt><dd>Принимает электронные</dd></dl></div>`).join('')}</div>`;
      }
      return `<div class="pagehead"><div><div class="eyebrow">Путь пациента за пределами клиники</div><h1>Партнёры</h1><p>Если услуги нет или нет времени, пациент идёт к партнёру с направлением и возвращается с результатом в тот же план.</p></div></div>
        <div class="tabs">${[['clinics', 'Клиники-партнёры'], ['refs', `Направления · ${refs.length}`], ['pharm', 'Аптеки-партнёры']].map(([id, label]) => `<button class="tab ${tab === id ? 'active' : ''}" data-action="partnersTab" data-id="${id}">${label}</button>`).join('')}</div>${body}`;
    }

    /* ---------- Аптека и заказы ---------- */
    function pharmacyAdmin(){
      const o = state.orders;
      const nextOf = x => x.type === 'otc' ? {'Собирается':'Готов к выдаче', 'Готов к выдаче':'Выдан'}[x.status] : {'Забронировано':'Выдан'}[x.status];
      return `<div class="pagehead"><div><div class="eyebrow">Маркетплейс и аптеки-партнёры</div><h1>Аптека и заказы</h1><p>Заказы без рецепта и брони по рецепту, которые пациенты оформили из своего плана.</p></div></div>
        <div class="grid three" style="margin-bottom:18px"><div class="card"><div class="metric">${o.filter(x => x.type === 'otc').length}</div><span class="muted">${plural(o.filter(x => x.type === 'otc').length, ['заказ', 'заказа', 'заказов'])} без рецепта</span></div><div class="card"><div class="metric">${o.filter(x => x.type === 'rx').length}</div><span class="muted">${plural(o.filter(x => x.type === 'rx').length, ['бронь', 'брони', 'броней'])} по рецепту</span></div><div class="card"><div class="metric">${o.filter(x => x.status !== 'Выдан').length}</div><span class="muted">ещё не выдано</span></div></div>
        <div class="tablewrap"><table><thead><tr><th>Номер</th><th>Пациент</th><th>Состав</th><th>Где выдают</th><th>Сумма</th><th>Статус</th><th></th></tr></thead><tbody>
          ${o.map(x => `<tr><td><strong>${x.id}</strong><small>${x.type === 'rx' ? 'по рецепту' : 'без рецепта'}</small></td><td>${safe(x.patient)}</td><td>${safe(x.items)}</td><td>${safe(x.place)}</td><td>${x.total}</td><td>${badge(x.status, x.status === 'Выдан' ? 'gray' : x.status === 'Готов к выдаче' ? '' : 'blue')}</td><td>${nextOf(x) ? btn(nextOf(x) === 'Выдан' ? 'Выдать' : 'Заказ собран', 'orderAdvance', 'secondary small', {id:x.id}) : ''}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="note" style="margin-top:16px">Продавец в каждом заказе — аптека-партнёр. Клиника видит статус, а рецептурный препарат выдают в аптеке по рецепту.</div>`;
    }

    /* ---------- Маршруты и правила ---------- */
    const SAMPLES = [['xray', 'Рентген'], ['ct', 'КТ'], ['mg', 'Маммография'], ['mri', 'МРТ'], ['norm', 'Без изменений'], ['other', 'Находка без правила']];
    const sampleText = id => id === 'other' ? 'МРТ головного мозга. В белом веществе лобных долей единичные очаги глиоза до 3 мм. Срединные структуры не смещены.\n\nЗаключение: единичные очаги глиоза в лобных долях.' : DEMO[id].draft;
    function sandboxResult(){
      const r = state.sandbox.result || (state.sandbox.text === sampleText(state.sel.sample) ? analyze(state.sandbox.text) : null);
      if (!r) return '<p style="margin:16px 0 0">Вставьте текст заключения или выберите пример, затем нажмите «Разобрать».</p>';
      const facts = `<div class="tlgroup" style="margin-top:18px">Что извлечено</div><div class="chips">${r.facts.map(([k, v]) => `<span class="chip">${k}: <b>${safe(v)}</b></span>`).join('') || '<span class="muted">Ничего не распознано</span>'}</div>`;
      let out;
      if (!r.rule) out = `<div class="note warn" style="margin-top:14px"><strong>Ручной разбор.</strong> Для такой находки правила нет. Обращение уйдёт врачу, пациент увидит план только после его решения.</div>`;
      else if (r.rule.id === 'NORM') out = `<div class="note" style="margin-top:14px"><strong>Правило NORM.</strong> ${r.rule.note}</div>`;
      else if (!r.approved) out = `<div class="note warn" style="margin-top:14px"><strong>Правило ${r.rule.id} найдено, но не утверждено клиникой.</strong> Вариант «${r.rule.steps.map(sv => lc(SERVICES[sv].title)).join(' и ')}» увидит только врач. Обращение уйдёт на ручной разбор.</div>`;
      else out = `<div class="resultmain" style="margin-top:14px;padding:18px"><div class="eyebrow">Следующий шаг · правило ${r.rule.id}, версия ${r.rule.version}</div><strong style="font-size:20px">${r.rule.steps.map(sv => SERVICES[sv].title).join(' + ')}</strong><p style="margin:7px 0 0">Срок: ${r.rule.due}. Пациент получит объяснение и предложение записи, координатор — обращение в очереди.</p></div>`;
      return facts + out;
    }
    function rules(){
      return `<div class="pagehead"><div><div class="eyebrow">Настройки клиники</div><h1>Маршруты и правила</h1><p>Что делать после каждой находки, решает клиника. Маршрутизатор применяет только утверждённые правила.</p></div></div>
        <div class="sectionhead" style="margin-top:0"><h2>Правила маршрута после исследований</h2></div>
        <div class="tablewrap"><table><thead><tr><th>Правило</th><th>Исследование</th><th>Находка в заключении</th><th>Следующий шаг</th><th>Срок</th><th>Статус</th><th></th></tr></thead><tbody>
          ${RULES.map(r => { const ok = state.ruleApproved[r.id]; return `<tr><td><strong>${r.id}</strong><small>версия ${r.version}</small></td><td>${r.study}</td><td>${r.finding}</td><td>${r.steps.map(sv => SERVICES[sv].title).join(' + ') || 'Маршрут не нужен, напоминание через год'}</td><td style="white-space:nowrap">${r.due || '—'}</td><td>${badge(ok ? 'Утверждено' : 'Черновик', ok ? '' : 'orange')}</td><td>${btn(ok ? 'В черновик' : 'Утвердить', 'ruleToggle', 'secondary small', {id:r.id})}</td></tr>`; }).join('')}
        </tbody></table></div>
        <div class="note warn" style="margin-top:14px">Правила в демо условные. Если подходящего утверждённого правила нет, обращение уходит на ручной разбор, а план назначает врач.</div>
        <div class="sectionhead"><h2>Проверить заключение</h2><span class="muted">Как маршрутизатор читает текст</span></div>
        <div class="panel"><div class="chips" style="margin-bottom:12px">${SAMPLES.map(([id, label]) => `<button class="chip ${state.sel.sample === id ? 'selected' : ''}" data-action="sample" data-id="${id}">${label}</button>`).join('')}</div>
          <div class="field"><label for="sbText">Текст заключения</label><textarea id="sbText" style="min-height:150px">${safe(state.sandbox.text)}</textarea></div>
          <div class="actions" style="margin-top:14px">${btn('Разобрать', 'sandboxRun')}</div>
          ${sandboxResult()}
          <p class="muted" style="margin:16px 0 0;font-size:13.5px">Демо ищет ключевые слова. В продукте заключение разбирает NLP-модель, а при сомнении случай уходит человеку.</p></div>
        <div class="sectionhead"><h2>Каналы и сопровождение</h2></div>
        <div class="grid two"><div class="panel"><h3>Доступные каналы</h3><div class="miniRow"><span>Частный приём</span>${badge('Включён')}</div><div class="miniRow"><span>ДМС</span>${badge('Включён')}</div><div class="miniRow"><span>ОМС</span>${badge('Справочный маршрут', 'orange')}</div><h3 style="margin-top:22px">Сценарии обращения</h3>${Object.values(scenarios).map(s => `<div class="miniRow"><span>${s.title}</span>${badge('Активен')}</div>`).join('')}</div>
          <div class="panel"><h3>Правила сопровождения</h3>${[['manual', 'Ручная проверка неоднозначных обращений'], ['alternate', 'Альтернативы при отсутствии слотов, включая партнёров'], ['followup', 'Напоминание о следующем шаге']].map(([id, label]) => `<label class="checkline" style="margin-bottom:10px"><input type="checkbox" data-rule="${id}" ${state.rules[id] ? 'checked' : ''}><span>${label}</span></label>`).join('')}<div class="note warn" style="margin-top:15px">Медицинские правила и вопросы о тревожных признаках проходят отдельное согласование. Эти переключатели показывают только интерфейс настройки.</div></div></div>`;
    }

    /* ---------- Аналитика ---------- */
    const FUNNELS = {
      imaging:[['Врач подтвердил заключение с находкой', 1248], ['Маршрутизатор предложил следующий шаг', 1173], ['Пациенту предложена запись', 1061], ['Пациент записался', 574], ['Визит состоялся', 487], ['Врач назначил следующий шаг', 312]],
      intake:[['Начали обращение', 1248], ['Заполнили анкету', 1011], ['Получили маршрут', 899], ['Выбрали запись', 574]]
    };
    function calcOut(){
      const c = state.calc;
      const visits = Math.max(0, Math.round(c.n * (c.target - c.base) / 100));
      return `<div><span>Дополнительных визитов в месяц</span><div class="metric">${visits.toLocaleString('ru-RU')}</div></div><div><span>Дополнительная выручка в месяц</span><div class="metric">${rub(visits * c.check)}</div></div><div><span>За год</span><div class="metric">${rub(visits * c.check * 12)}</div></div>`;
    }
    function analytics(){
      const kind = state.sel.funnel || 'imaging', f = FUNNELS[kind], top = f[0][1], c = state.calc;
      return `<div class="pagehead"><div><div class="eyebrow">Оценка продукта</div><h1>Аналитика</h1><p>Вымышленные данные для демонстрации будущих отчётов.</p></div></div>
        <div class="grid three"><div class="card"><div class="metric">1 248</div><span class="muted">заключений с находкой за месяц</span></div><div class="card"><div class="metric">46%</div><span class="muted">пациентов записались на следующий шаг</span></div><div class="card"><div class="metric">3 ч 20 мин</div><span class="muted">от заключения до предложения записи, медиана</span></div></div>
        <div class="sectionhead"><h2>Воронка</h2></div>
        <div class="tabs">${[['imaging', 'После исследований'], ['intake', 'Самостоятельные обращения']].map(([id, label]) => `<button class="tab ${kind === id ? 'active' : ''}" data-action="funnel" data-id="${id}">${label}</button>`).join('')}</div>
        <div class="panel">${f.map(([label, v], i) => { const pct = Math.round(v / top * 100); const prev = i ? Math.round(v / f[i - 1][1] * 100) : 100; return `<div class="funnelrow" title="${v.toLocaleString('ru-RU')} обращений${i ? ` · ${prev}% от предыдущего шага` : ''}"><div class="miniRow"><strong>${label}</strong><span>${v.toLocaleString('ru-RU')} · ${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`; }).join('')}</div>
        <div class="sectionhead"><h2>По сервисам</h2></div>
        <div class="grid three">
          <div class="card"><div class="metric">6%</div><span class="muted">черновиков ИИ исправил врач · «Что на снимке?»</span></div>
          <div class="card"><div class="metric">4%</div><span class="muted">шагов просрочено · путь пациента</span></div>
          <div class="card"><div class="metric">42 мин</div><span class="muted">врач отвечает на запрос, медиана · врач — клиника</span></div>
          <div class="card"><div class="metric">31%</div><span class="muted">записей сделано из сообщения · клиника — пациент</span></div>
          <div class="card"><div class="metric">118</div><span class="muted">направлений к партнёрам, 76% вернулись с результатом</span></div>
          <div class="card"><div class="metric">272</div><span class="muted">заказа и брони в аптеках-партнёрах</span></div>
        </div>
        <div class="sectionhead"><h2>Качество и безопасность</h2></div>
        <div class="grid three"><div class="card"><div class="metric">8%</div><span class="muted">обращений ушло на ручной разбор</span></div><div class="card"><div class="metric">3,1%</div><span class="muted">маршрутов изменил врач</span></div><div class="card"><div class="metric">0</div><span class="muted">инцидентов в демонстрационных данных</span></div></div>
        <div class="sectionhead"><h2>Оценка эффекта для клиники</h2><span class="muted">Подставьте цифры своей клиники</span></div>
        <div class="panel"><div class="calc">
            <div class="field"><label for="cN">Заключений с находкой в месяц</label><input id="cN" type="number" min="0" step="50" data-calc="n" value="${c.n}"></div>
            <div class="field"><label for="cB">Доходят до следующего шага сейчас, %</label><input id="cB" type="number" min="0" max="100" data-calc="base" value="${c.base}"></div>
            <div class="field"><label for="cT">Доходят с сервисом, %</label><input id="cT" type="number" min="0" max="100" data-calc="target" value="${c.target}"></div>
            <div class="field"><label for="cC">Средний чек следующего шага, ₽</label><input id="cC" type="number" min="0" step="100" data-calc="check" value="${c.check}"></div>
          </div><div class="calcout" id="calcOut">${calcOut()}</div>
          <p class="muted" style="margin:16px 0 0;font-size:13.5px">Значения по умолчанию условные. Считаем только первый следующий шаг, без повторных визитов, партнёров и аптеки.</p></div>
        <div class="note" style="margin-top:18px">В рабочем продукте показатели считаются из реальных событий обращения. Рост записи оценивается вместе с качеством маршрутов и ручными исправлениями.</div>`;
    }

    /* =====================================================================
       Экраны врача и карта сервисов
       ===================================================================== */
    const studyBadge = st => ({processing:badge('Обрабатывается', 'blue'), awaiting:badge('Ждёт проверки', 'orange'), confirmed:badge('Подтверждено врачом'), manual:badge('Ручное описание', 'gray')}[st.status]);
    const aiSummary = st => { const f = DEMO[st.kind].findings[0]; return f ? `ИИ: ${lc(f.label)}, ${f.place}. Оценка модели ${f.conf}` : 'ИИ: находок выше порога нет'; };

    function reading(){
      const wait = state.studies.filter(s => s.status === 'awaiting');
      const done = state.studies.filter(s => s.status === 'confirmed');
      return `<div class="pagehead"><div><div class="eyebrow">Сервис «Что на снимке?»</div><h1>Черновики ИИ на проверку</h1><p>ИИ готовит черновик заключения, врач его подтверждает. До этого ни пациент, ни координатор результата не видят.</p></div></div>
        <div class="grid three" style="margin-bottom:18px"><div class="card"><div class="metric">${wait.length}</div><span class="muted">${plural(wait.length, ['ждёт', 'ждут', 'ждут'])} проверки</span></div><div class="card"><div class="metric">${done.length}</div><span class="muted">подтверждено</span></div><div class="card"><div class="metric">${done.filter(s => s.edited).length}</div><span class="muted">черновиков исправлено врачом</span></div></div>
        <div class="sectionhead" style="margin-top:8px"><h2>Ждут проверки</h2></div>
        ${wait.length ? `<div class="grid two">${wait.map(st => `<div class="card">${studyBadge(st)}<h3 style="margin-top:13px">${safe(st.patient)}</h3><p>${DEMO[st.kind].title} · ${lc(safe(st.date))}<br>${aiSummary(st)}</p><div class="actions">${btn('Открыть снимок', 'studyOpen', 'small', {id:st.id})}</div></div>`).join('')}</div>` : '<div class="panel empty"><h3>Всё проверено</h3><p>Новые исследования появятся здесь, когда придут из РИС или от пациента.</p></div>'}
        <div class="sectionhead"><h2>Подтверждённые</h2></div>
        <div class="tablewrap"><table><thead><tr><th>Пациент</th><th>Исследование</th><th>Находка</th><th>Что дальше</th><th></th></tr></thead><tbody>
          ${done.map(st => { const e = st.episodeId && ep(st.episodeId); return `<tr><td><strong>${safe(st.patient)}</strong></td><td>${DEMO[st.kind].title}<small>${safe(st.date)}</small></td><td>${DEMO[st.kind].findings[0] ? DEMO[st.kind].findings[0].label : 'Изменений не выявлено'}${st.edited ? '<small>черновик исправлен</small>' : ''}</td><td>${e ? safe(nextStepLabel(e)) : 'Маршрут не нужен'}</td><td>${btn('Открыть', 'studyOpen', 'secondary small', {id:st.id})}</td></tr>`; }).join('')}
        </tbody></table></div>`;
    }

    function study(){
      const st = state.studies.find(x => x.id === state.sel.study) || state.studies[0];
      const d = DEMO[st.kind], f = d.findings[0];
      const canEdit = state.role === 'doctor' && st.status === 'awaiting';
      const e = st.episodeId && ep(st.episodeId);
      const back = state.role === 'doctor' ? navBtn('← К списку', 'reading', 'secondary') : state.role === 'staff' ? (e ? `<button class="btn secondary" data-case="${e.id}">← К обращению</button>` : navBtn('← К обращениям', 'inbox', 'secondary')) : navBtn('← Назад', 'imaging', 'secondary');
      const under = d.scheme === 'ct' && f
        ? `<input type="range" id="slice" min="130" max="154" value="142" aria-label="Номер среза"><div class="cap"><span id="sliceLabel">Срез 142 из 310</span><span>Находка на срезах 139–145</span></div><div class="cap"><span>${d.files}</span><span>Схема, не медицинское изображение</span></div>`
        : `<div class="cap"><span>${d.files}</span><span>Схема, не медицинское изображение</span></div>`;
      const text = st.status === 'confirmed' ? st.conclusion : d.draft;
      return `<div class="pagehead"><div><div class="eyebrow">Сервис «Что на снимке?»</div><h1>${safe(st.patient)}</h1><p>${d.title} · ${lc(safe(st.date))} · ${safe(st.source)}</p></div><div class="actions">${studyBadge(st)}${back}</div></div>
        <div class="twocol study"><div class="stack"><div class="viewer">${SCHEME[d.scheme](!!f, f ? f.conf : '')}${under}</div>
            <div class="note">Модель отмечает только те находки, на которые её проверяли. ${d.modality === 'mg' ? 'Категорию BI-RADS сервис не присваивает: её указывает врач.' : 'Если протокол или область не подходят модели, исследование сразу уходит на ручное описание.'}</div></div>
          <div class="stack"><div class="panel"><h3>Находки ИИ</h3>
              ${d.findings.length ? d.findings.map(x => `<div class="finding"><span class="dot now"></span><span><strong>${x.label}</strong><small>${x.place}</small><small>Оценка модели: ${x.conf}</small></span></div>`).join('') : '<p>Находок выше порога нет. Такое исследование всё равно смотрит врач.</p>'}
              <dl class="kv" style="margin-top:14px"><dt>Черновик готовил</dt><dd>${st.uploaded ? 'ИИ-модель сервиса, снимок загрузил пациент' : 'ИИ-сервис «Третье мнение», демо-интеграция'}</dd><dt>Файлы</dt><dd>${d.files}${st.file ? ' · ' + safe(st.file) : ''}</dd><dt>Проверка DICOM</dt><dd>Серия полная, протокол подходит модели</dd></dl></div>
            <div class="panel"><h3>${canEdit ? 'Черновик заключения' : 'Заключение'}</h3>
              ${canEdit ? `<div class="field"><textarea id="draft" style="min-height:190px" aria-label="Текст заключения">${safe(d.draft)}</textarea><small>Каждая фраза черновика построена из находки ИИ. Правьте текст как обычно: дальше пойдёт только то, что вы подтвердите.</small></div><div class="actions">${btn('Подтвердить заключение', 'studyConfirm', '', {id:st.id})}${btn('Описать без ИИ', 'studyManual', 'secondary', {id:st.id})}</div>`
                : st.status === 'confirmed' ? `<div class="quote">${highlight(text)}</div><p style="margin:12px 0 0">${safe(st.confirmedBy)}, подтверждено ${safe(st.confirmedAt)}${st.edited ? ' · черновик ИИ исправлен' : ''}</p>${e && state.role !== 'patient' ? `<div class="actions"><button class="btn secondary small" data-case="${e.id}">Открыть обращение</button></div>` : st.noRoute ? '<p style="margin:10px 0 0">Маршрут не нужен: пациент получил результат и напоминание через 12 месяцев.</p>' : ''}`
                : `<p style="margin:0">${st.status === 'manual' ? 'Врач описывает исследование без черновика ИИ.' : 'Заключение появится после проверки врачом.'}</p>`}
            </div></div></div>`;
    }

    function doctor(){
      const visits = state.episodes.flatMap(e => e.steps.filter(s => s.status === 'confirmed' && s.slot && !s.slot.partner).map(s => [e, s]));
      const today = visits.filter(([, s]) => s.slot.date === 'Сегодня'), later = visits.filter(([, s]) => s.slot.date !== 'Сегодня');
      const out = awaitingOutcome();
      const why = e => { const st = e.kind === 'imaging' ? studyOf(e) : null; if (!st) return 'Со слов пациента: ' + safe(state.symptoms || 'не указано'); const f = DEMO[st.kind].findings[0]; return `${DEMO[st.kind].title}: ${f ? lc(f.label) + ', ' + f.place : 'изменений не выявлено'}`; };
      const card = ([e, s], tag, tone) => `<div class="card">${badge(tag, tone)}<h3 style="margin-top:13px">${safe(e.patient)}</h3><p>${title(s)}, ${lc(slotLine(s.slot))}<br>${why(e)}</p><div class="actions"><button class="btn secondary small" data-case="${e.id}">Открыть карточку</button>${btn('Итог приёма', 'planOpen', 'small', {id:e.id, step:s.id})}</div></div>`;
      return `<div class="pagehead"><div><div class="eyebrow">Перед приёмом и после него</div><h1>Мои пациенты</h1><p>Перед приёмом врач видит заключение и то, что уже сделано. После приёма вносит итог, и план пациента обновляется.</p></div></div>
        <div class="sectionhead" style="margin-top:0"><h2>Ждут итога приёма</h2></div>
        ${out.length ? `<div class="grid two">${out.map(x => card(x, 'Визит состоялся: нужен итог', 'orange')).join('')}</div>` : '<div class="note">Итоги по всем состоявшимся визитам внесены.</div>'}
        <div class="sectionhead"><h2>Сегодня на приёме</h2></div>
        ${today.length ? `<div class="grid two">${today.map(x => card(x, 'Сегодня, ' + x[1].slot.time, 'blue')).join('')}</div>` : '<div class="note">На сегодня записей нет.</div>'}
        ${later.length ? `<div class="sectionhead"><h2>Ближайшие дни</h2></div><div class="grid two">${later.map(x => card(x, slotLine(x[1].slot), 'gray')).join('')}</div>` : ''}
        <div class="note" style="margin-top:18px">В рабочем продукте этот экран может быть частью медицинской информационной системы клиники.</div>`;
    }
    function planModal(id, stepId){
      const e = ep(id), s = stepId ? stepOf(e, stepId) : null;
      const taken = e.steps.filter(live).map(x => x.service);
      const opts = (NEXT[e.ruleId] || NEXT.own).filter(o => !taken.includes(o[0]) || (s && o[0] === s.service));
      const summary = {'XR-INF':'Осмотр, аускультация. Назначено лечение и контроль.', 'CT-NOD':'Очаг без признаков роста, наблюдение.', 'MG-ADD':'Осмотр, направлена на дообследование.', 'MR-MEN':'Осмотр колена, консервативное лечение.'}[e.ruleId] || 'Осмотр, даны рекомендации.';
      openModal(`${modalHead(s ? 'Итог приёма' : 'План врача', safe(e.patient))}
        ${s ? `<p>${title(s)} · ${lc(slotLine(s.slot))}</p><div class="field"><label for="outSummary">Краткий итог</label><textarea id="outSummary" style="min-height:74px">${summary}</textarea></div>` : `<p>${safe(e.title)}. Шаги увидят пациент и координатор.</p>`}
        <div class="field" style="margin-top:14px"><label>Следующие шаги</label>${opts.map(([sv, due, on]) => `<label class="checkline" style="margin-bottom:8px"><input type="checkbox" data-next="${sv}" ${on ? 'checked' : ''}><span><strong>${SERVICES[sv].title}</strong><br><span class="muted">${due}${partnerOnly(sv) ? ' · клиника-партнёр' : ''}</span></span></label>`).join('') || '<p style="margin:0">Все подходящие шаги уже есть в плане.</p>'}</div>
        ${s ? `<label class="checkline" style="margin-top:6px"><input type="checkbox" id="outRx" ${e.ruleId === 'XR-INF' ? 'checked' : ''}><span><strong>Выписать электронный рецепт</strong><br><span class="muted">Пациент увидит его в разделе «Аптека» и забронирует препараты в аптеке-партнёре</span></span></label>` : ''}
        <div class="note" style="margin-top:14px">Новые шаги появляются только после решения врача. Маршрутизатор сам план не меняет.</div>
        <div class="actions">${btn('Сохранить', 'planSave', '', {id, step:stepId || ''})}${btn('Отмена', 'close', 'secondary')}</div>`, true);
    }

    /* ---------- Карта сервисов ---------- */
    const jump = (label, target, kind = 'secondary small') => `<button class="btn ${kind}" data-jump="${target}">${label}</button>`;
    function services(){
      const cards = [
        ['scan', '', 'Что на снимке?', 'Принимает снимок или готовое заключение ИИ и показывает врачу черновик с находками. После подтверждения объясняет результат пациенту простыми словами.', [['Глазами пациента', 'patient:imaging'], ['Глазами врача', 'doctor:reading']]],
        ['route', '', 'Путь пациента', 'Маршрутизатор читает подтверждённое заключение и по правилам клиники предлагает следующий шаг. Эпизод ведёт пациента через запись, визит и новые назначения в клинике и у партнёров.', [['План пациента', 'patient:plan'], ['Очередь координатора', 'staff:inbox'], ['Партнёры', 'staff:partners:refs']]],
        ['doctor', 'blue', 'Врач — клиника', 'Координатор просит врача подтвердить маршрут. Врач передаёт, кого и куда записать после приёма. Каждый запрос привязан к обращению.', [['Глазами координатора', 'staff:requests'], ['Глазами врача', 'doctor:requests']]],
        ['message', 'blue', 'Клиника — пациент', 'Сообщение уходит, когда готов результат, пора записаться или изменился план. Пациент отвечает кнопкой: записаться, попросить звонок, отложить.', [['Переписка пациента', 'patient:messages'], ['Журнал клиники', 'staff:comms']]],
        ['cart', 'violet', 'Маркетплейс без рецепта', 'Безрецептурные товары из аптек-партнёров. Заказ можно забрать в клинике в день приёма.', [['Каталог', 'patient:pharmacy:otc'], ['Заказы', 'staff:pharmacyAdmin']]],
        ['pharmacy', 'violet', 'Аптеки-партнёры', 'Электронный рецепт после приёма попадает в план. Пациент видит наличие и бронирует препарат в аптеке рядом.', [['Рецепты пациента', 'patient:pharmacy:rx'], ['Сеть аптек', 'staff:partners:pharm']]]
      ];
      const node = (t, sub, n) => `<div class="node"><div class="nodehead">${n ? `<b class="num">${n}</b>` : ''}<span>${t}</span></div><small>${sub}</small></div>`;
      return `<div class="pagehead"><div><div class="eyebrow">Обзор продукта</div><h1>Карта сервисов</h1><p>ИИ-заключение по снимку превращается в следующий шаг пациента. Шесть сервисов закрывают путь от снимка до аптеки.</p></div></div>
        <div class="panel"><div class="flow">
          <div class="flowcol"><div class="flowhead">Откуда приходят данные</div>${node('РИС и PACS клиники', 'Снимки DICOM и описания')}${node('ИИ-сервисы «Третье мнение»', 'Заключения ИИ по КТ, рентгену, маммографии')}${node('МИС клиники', 'Расписание, карта пациента, итоги визитов')}${node('Пациент', 'Снимок или заключение из другой клиники')}</div>
          <div class="arrow">→</div>
          <div class="flowcol core"><div class="flowhead">МедМаршрут</div>${node('Что на снимке?', 'Черновик ИИ, затем подтверждение врача', 1)}<div class="down">↓</div>${node('Путь пациента', 'Заключение, следующий шаг, эпизод сопровождения', 2)}<div class="down">↓</div><div class="pair">${node('Врач — клиника', 'Решения и запросы', 3)}${node('Клиника — пациент', 'Сообщения и ответы', 4)}</div><div class="pair">${node('Маркетплейс', 'Товары без рецепта', 5)}${node('Аптеки-партнёры', 'Бронь по рецепту', 6)}</div></div>
          <div class="arrow">→</div>
          <div class="flowcol"><div class="flowhead">Кто этим пользуется</div>${node('Пациент', 'Личный кабинет и приложение: объяснение, запись, план, аптека')}${node('Координатор', 'Очередь, рекомендация, запись')}${node('Врач', 'Черновик ИИ, итог приёма, рецепт')}${node('Клиники-партнёры', 'Направление туда, результат обратно')}${node('Аптеки-партнёры', 'Наличие, бронь, выдача')}</div>
        </div></div>
        <div class="sectionhead"><h2>Шесть сервисов</h2><span class="muted">Кнопки открывают нужный экран в нужной роли</span></div>
        <div class="grid three">${cards.map(([ic, tone, name, text, links], i) => `<div class="card"><div class="tile ${tone}">${icon(ic)}</div><h3>${i + 1}. ${name}</h3><p>${text}</p><div class="actions" style="margin-top:16px">${links.map(([l, t]) => jump(l, t)).join('')}</div></div>`).join('')}</div>
        <div class="sectionhead"><h2>Как показать за три минуты</h2></div>
        <div class="panel"><ol class="routeSteps">
          <li><b>1</b><span><strong>Пациент узнаёт результат.</strong> На главной — «Результат рентгенографии готов», в разделе «Что на снимке» — объяснение и следующий шаг. ${jump('Открыть', 'patient:imaging', 'ghost small')}</span></li>
          <li><b>2</b><span><strong>Пациент записывается.</strong> Время в своей клинике или у партнёра, без звонка. ${jump('Открыть', 'patient:appointments', 'ghost small')}</span></li>
          <li><b>3</b><span><strong>Координатор видит, кто не дошёл.</strong> В карточке — заключение, рекомендация и причина задержки. ${jump('Открыть', 'staff:inbox', 'ghost small')}</span></li>
          <li><b>4</b><span><strong>Врач проверяет черновик ИИ.</strong> После подтверждения маршрут строится сам. ${jump('Открыть', 'doctor:reading', 'ghost small')}</span></li>
          <li><b>5</b><span><strong>Врач вносит итог приёма.</strong> Назначает следующие шаги и выписывает рецепт. ${jump('Открыть', 'doctor:doctor', 'ghost small')}</span></li>
          <li><b>6</b><span><strong>План продолжается.</strong> У пациента новый этап, бронь по рецепту и заказ без рецепта. ${jump('Открыть', 'patient:pharmacy:rx', 'ghost small')}</span></li>
        </ol></div>
        <div class="sectionhead"><h2>На чём держится безопасность</h2></div>
        <div class="grid two">
          <div class="card"><h3>Диагноз ставит врач</h3><p>ИИ готовит черновик, врач его подтверждает. До подтверждения результат не видят ни пациент, ни координатор.</p></div>
          <div class="card"><h3>План меняет человек или утверждённое правило</h3><p>Маршрутизатор применяет только правила, которые утвердила клиника. Нет правила — случай уходит врачу.</p></div>
          <div class="card"><h3>Срочность не зависит от оценки модели</h3><p>Срок следующего шага задают правило или врач. Число «0,91» остаётся в журнале для аудита.</p></div>
          <div class="card"><h3>Заключение не уходит в мессенджеры</h3><p>В SMS и мессенджерах только ссылка. Текст заключения пациент читает в личном кабинете.</p></div>
        </div>`;
    }

    /* =====================================================================
       Действия и события
       ===================================================================== */
    const PAGES = {home, intake, review, result, plan, imaging, appointments, messages, pharmacy, documents, inbox, case:casePage, scheduling, requests, comms, partners, pharmacyAdmin, rules, analytics, reading, study, doctor, services};
    let orderNo = 1040, reserveNo = 217;
    const actor = () => state.role === 'patient' ? 'Пациент' : state.role === 'doctor' ? 'Врач' : 'Наталья, координатор';
    const clearIntake = () => { Object.assign(state, {symptoms:'', duration:'', redflag:false, doctor:'', wait:'', documentName:'', documentNotes:'', routeCreated:false}); state.episodes = state.episodes.filter(e => e.id !== 'own'); };

    function formValues(){
      const data = new FormData($('#intakeForm'));
      return {symptoms:data.get('symptoms') || '', duration:data.get('duration') || '', city:data.get('city') || '', age:data.get('age'), channel:data.get('channel'), doctor:data.get('doctor') || state.doctor, wait:data.get('wait') || state.wait, redflag:data.has('redflag')};
    }
    function advanceReferral(r){
      const i = REF_FLOW.indexOf(r.status);
      const e = r.episodeId && ep(r.episodeId), s = e && stepOf(e, r.stepId);
      if (i === 0 && s){ slotListModal(refKey(e, s), 'staff'); return; }
      if (i < 0 || i >= REF_FLOW.length - 1) return;
      r.status = REF_FLOW[i + 1];
      if (s && r.status === 'Услуга оказана'){ s.status = 'attended'; addLog(e, PARTNERS[r.partner].name, 'Услуга оказана: ' + title(s)); }
      if (s && r.status === 'Результат получен'){
        s.status = 'completed'; s.outcome = 'Результат от партнёра получен';
        addLog(e, PARTNERS[r.partner].name, 'Результат передан в клинику: ' + title(s));
        notify(e, 'Результат от партнёра', `Результат от партнёра уже в вашем плане: ${lc(title(s))}. Врач посмотрит его и назначит следующий шаг.`, [['Открыть план', 'nav', 'plan']]);
        if (!e.steps.some(live)){
          e.status = 'manual_review'; e.suggest = []; e.reason = 'Пришёл результат от партнёра: врач назначает следующий шаг';
          mkRequest(e, 'staff', 'route', 'Результат от партнёра', `${e.patient}: пришёл результат от партнёра (${lc(title(s))}). Посмотрите и назначьте следующий шаг.`);
        }
      }
      render();
      toast('Направление: ' + lc(r.status));
    }

    const ACTIONS = {
      menu(){ mobileOpen = !mobileOpen; renderShell(); },
      close(){ closeModal(); },
      reset(){ state = freshState(); mobileOpen = false; modal = null; orderNo = 1040; reserveNo = 217; render(); window.scrollTo(0, 0); toast('Демо возвращено к началу'); },

      /* --- новое обращение (первая версия) --- */
      new(){ clearIntake(); state.scenario = 'symptoms'; state.role = 'patient'; go('intake'); },
      newDocument(){ state.scenario = 'document'; go('intake'); },
      how(){
        openModal(`${modalHead('', 'Как работает МедМаршрут')}<ol><li>Вы проходите исследование или рассказываете о ситуации. Снимок из другой клиники можно загрузить.</li><li>ИИ готовит черновик заключения, врач его подтверждает. Мы объясняем результат простыми словами.</li><li>Вы видите следующий шаг и записываетесь в клинике или у партнёра.</li><li>После приёма врач обновляет план. Рецепт и аптека — там же.</li></ol><p>Для сотрудников клиники есть очередь обращений, связь с врачом и пациентом, контроль качества.</p><div class="actions">${btn('Начать', 'new')}${navBtn('Карта сервисов', 'services', 'secondary')}</div>`);
      },
      createRoute(){ state.documentNotes = $('#documentNotes') ? $('#documentNotes').value : ''; state.routeCreated = true; createOwnEpisode(); go('result'); },
      bookOwn(){ const e = ep('own'), s = e && currentStep(e); if (s){ state.sel.book = refKey(e, s); state.sel.slotTab = 'all'; go('appointments'); } else go('plan'); },
      async copySummary(){
        try { await navigator.clipboard.writeText(summaryText()); toast('Выжимка скопирована'); }
        catch (err){ openModal(`${modalHead('', 'Выжимка для врача')}<textarea style="width:100%;height:260px">${safe(summaryText())}</textarea>`); }
      },
      summary(){ openModal(`${modalHead('', 'Выжимка для врача')}<p>Проверьте содержание перед передачей врачу.</p><textarea style="width:100%;height:260px">${safe(summaryText())}</textarea><div class="actions">${btn('Скопировать', 'copySummary')}</div>`); },
      noSlots(){
        openModal(`${modalHead('Если записи нет', 'Проверим другие варианты')}<ol><li>Другой филиал или время.</li><li>Клиника-партнёр: направление и заключение передадим сами.</li><li>Дистанционная консультация, если это уместно.</li><li>Помощь координатора клиники.</li></ol><div class="note warn">Если состояние изменилось или вызывает тревогу, не ориентируйтесь на дату плановой записи.</div><div class="actions">${btn('Запросить помощь координатора', 'coordinator')}${btn('Посмотреть время', 'bookOwn', 'secondary')}</div>`);
      },
      coordinator(){ const e = ep('own') || myEpisodes()[0]; if (e) ACTIONS.callback({id:e.id}); else { closeModal(); toast('Задача добавлена в очередь клиники'); } },
      removeDoc(){ state.documentName = ''; render(); toast('Документ убран из обращения'); },

      /* --- запись --- */
      book(d){ state.sel.book = d.key; state.sel.slotTab = 'all'; state.role = 'patient'; go('appointments'); },
      slotTab(d){ state.sel.slotTab = d.id; render(); },
      slotAsk(d){ slotAskModal(d.key, d.slot, d.mode); },
      slotList(d){ slotListModal(d.key, d.mode); },
      slotConfirm(d){
        const [e, s] = byKey(d.key);
        const slot = slotsFor(s.service).find(x => x.id === d.slot);
        closeModal();
        if (d.mode === 'offer'){ offerStep(e, s, slot); render(); toast('Предложение отправлено пациенту'); }
        else if (d.mode === 'staff'){ bookStep(e, s, slot, 'staff'); render(); toast('Пациент записан: ' + lc(slotLine(slot))); }
        else { bookStep(e, s, slot, 'patient'); state.sel.book = null; go('plan'); toast('Демонстрационная запись сохранена'); }
      },
      accept(d){ const [e, s] = byKey(d.key); if (s && s.status === 'offered'){ bookStep(e, s, s.slot, 'patient'); toast('Запись подтверждена'); } go('plan'); },
      unbook(d){ const [e, s] = byKey(d.key); if (s && s.status === 'confirmed'){ unbookStep(e, s, actor()); toast('Запись отменена'); } render(); },
      later(d){ laterModal(d.key); },
      laterSend(d){
        const [e, s] = byKey(d.key);
        const r = $('input[name=reason]:checked');
        const reason = r ? r.value : REASONS[4];
        refuseStep(e, s, reason);
        pushMsg('patient', 'Пока откладываю запись: ' + lc(reason) + '.');
        closeModal(); go('plan'); toast('Координатор увидит причину и предложит другой вариант');
      },
      reopen(d){
        const [e, s] = byKey(d.key);
        if (!s) return;
        reopenStep(e, s, actor());
        if (state.role === 'patient'){ state.sel.book = d.key; state.sel.slotTab = 'all'; go('appointments'); }
        else { render(); toast('Шаг снова в работе'); }
      },
      callback(d){
        const e = ep(d.id) || myEpisodes()[0];
        if (!e) return;
        e.callback = true;
        addLog(e, 'Пациент', 'Просит перезвонить');
        pushMsg('patient', 'Перезвоните мне, пожалуйста.');
        closeModal(); render(); toast('Задача добавлена в очередь клиники');
      },

      /* --- сообщения пациента --- */
      msgSend(){
        const i = $('#msgText'), text = i && i.value.trim();
        if (!text) return;
        pushMsg('patient', text);
        const e = myEpisodes().find(x => !['completed', 'closed'].includes(x.status)) || myEpisodes()[0];
        if (e){ e.callback = true; addLog(e, 'Пациент', 'Сообщение координатору: ' + text); }
        render();
      },
      msgAct(d){
        const k = d.kind, a = d.arg;
        if (k === 'nav'){ go(a); return; }
        if (k === 'rxTab'){ ACTIONS.rxTab(); return; }
        if (k === 'orders'){ state.sel.pharmTab = 'orders'; go('pharmacy'); return; }
        if (k === 'callback'){ ACTIONS.callback({id:a}); return; }
        const [e, s] = byKey(a);
        const stale = () => { go('plan'); toast('Этот шаг уже изменился: открыли план'); };
        if (!e || !s || ['manual_review', 'completed', 'closed'].includes(e.status)){ stale(); return; }
        if (k === 'accept'){ if (s.status === 'offered') ACTIONS.accept({key:a}); else stale(); return; }
        if (k === 'later'){ if (['open', 'offered'].includes(s.status)) laterModal(a); else stale(); return; }
        if (k === 'book'){
          if (s.status === 'refused') reopenStep(e, s, 'Пациент');
          if (['open', 'offered', 'confirmed'].includes(s.status)){ state.sel.book = a; state.sel.slotTab = 'all'; go('appointments'); } else stale();
        }
      },

      /* --- аптека --- */
      pharmTab(d){ state.sel.pharmTab = d.id; render(); },
      rxTab(){ state.role = 'patient'; state.sel.pharmTab = 'rx'; go('pharmacy'); },
      cat(d){ state.sel.cat = d.id; render(); },
      cartAdd(d){ state.cart[d.id] = (state.cart[d.id] || 0) + 1; render(); },
      cartDec(d){ const q = (state.cart[d.id] || 0) - 1; if (q > 0) state.cart[d.id] = q; else delete state.cart[d.id]; render(); },
      checkoutOpen(){ checkoutModal(); },
      checkout(){
        const r = $('input[name=place]:checked'), id = r ? r.value : 'ph0';
        const place = id === 'delivery' ? 'Доставка курьером' : PHARMACIES.find(x => x.id === id).name;
        const items = Object.entries(state.cart).map(([pid, q]) => PRODUCTS.find(x => x.id === pid).name + (q > 1 ? ` × ${q}` : '')).join(', ');
        const o = {id:'З-' + (++orderNo), type:'otc', patient:'Демо-пациент', mine:true, items, total:rub(cartTotal() + (id === 'delivery' ? 250 : 0)), place, status:'Собирается'};
        state.orders.unshift(o); state.cart = {}; state.sel.pharmTab = 'orders';
        closeModal(); render(); toast(`Заказ ${o.id} оформлен`);
      },
      rxReserve(d){
        const p = state.prescriptions.find(x => x.id === d.id), ph = PHARMACIES.find(x => x.id === d.ph);
        p.status = 'reserved'; p.pharmacy = ph.id; p.code = String(4800 + (++seq % 100));
        state.orders.unshift({id:'Б-0' + (++reserveNo), type:'rx', patient:p.patient, mine:p.mine, items:`Рецепт № ${p.number}, ${p.items.length} ${plural(p.items.length, ['препарат', 'препарата', 'препаратов'])}`, total:RX_STOCK[ph.id][1], place:ph.name, status:'Забронировано', rxId:p.id});
        render(); toast('Бронь оформлена, код выдачи ' + p.code);
      },
      rxCancel(d){ const p = state.prescriptions.find(x => x.id === d.id); state.orders = state.orders.filter(o => o.rxId !== p.id); p.status = 'issued'; p.pharmacy = null; p.code = null; render(); toast('Бронь отменена'); },
      orderAdvance(d){
        const o = state.orders.find(x => x.id === d.id);
        const next = o.type === 'otc' ? {'Собирается':'Готов к выдаче', 'Готов к выдаче':'Выдан'}[o.status] : {'Забронировано':'Выдан'}[o.status];
        if (!next) return;
        o.status = next;
        if (o.type === 'rx' && next === 'Выдан'){ const p = state.prescriptions.find(x => x.id === o.rxId); if (p) p.status = 'done'; }
        if (o.mine && next === 'Готов к выдаче') pushMsg('clinic', `Заказ ${o.id} готов к выдаче: ${lc(o.place)}.`, [['Мои заказы', 'orders', '']]);
        render(); toast('Статус: ' + lc(next));
      },

      /* --- что на снимке --- */
      uploadOpen(){ state.role = 'patient'; go('imaging'); uploadModal(); },
      upload(){
        if (!$('#upConsent').checked){ toast('Отметьте, что разрешаете передать исследование врачу'); return; }
        const f = $('#upFile').files[0];
        const st = {id:'st' + (++seq), patient:'Демо-пациент', mine:true, kind:$('#upKind').value, date:'Только что', source:'Загружено пациентом', uploaded:true, file:f ? f.name : '', status:'processing'};
        state.studies.unshift(st);
        closeModal(); render(); toast('Исследование принято');
        setTimeout(() => {
          if (!state.studies.includes(st) || st.status !== 'processing') return;
          st.status = 'awaiting';
          if (['imaging', 'reading'].includes(state.page) && !modal){ render(); toast('ИИ подготовил черновик. Его проверяет врач'); }
        }, 1800);
      },
      studyOpen(d){ state.sel.study = d.id; go('study'); },
      studyConfirm(d){
        const st = state.studies.find(x => x.id === d.id), text = $('#draft').value.trim();
        if (!text){ toast('Заключение пустое: добавьте текст'); return; }
        st.conclusion = text; st.edited = text !== DEMO[st.kind].draft.trim();
        st.status = 'confirmed'; st.confirmedBy = 'Д. Ершов, врач-рентгенолог'; st.confirmedAt = 'только что';
        const e = createEpisodeFromStudy(st);
        go('reading');
        toast(!e ? 'Подтверждено. Маршрут не нужен: пациент получит результат и напоминание' : e.status === 'manual_review' ? 'Подтверждено. Подходящего утверждённого правила нет: нужен план врача' : 'Подтверждено. Пациент получил объяснение, координатор — обращение');
      },
      studyManual(d){ const st = state.studies.find(x => x.id === d.id); st.status = 'manual'; go('reading'); toast('Исследование передано на ручное описание'); },

      /* --- координатор --- */
      inboxTab(d){ state.sel.inboxTab = d.id; render(); },
      attend(d){ const [e, s] = byKey(d.key); attendStep(e, s); render(); toast('Визит отмечен. Обращение ждёт итога врача'); },
      stopEp(d){
        const e = ep(d.id);
        e.steps.filter(live).forEach(s => { s.status = 'superseded'; });
        e.status = 'closed'; e.reason = 'Сопровождение остановлено: ' + lc(e.reason || 'по решению клиники');
        addLog(e, 'Наталья, координатор', e.reason);
        render(); toast('Сопровождение остановлено');
      },
      askDoctor(d){
        const e = ep(d.id), st = e.kind === 'imaging' ? studyOf(e) : null;
        if (e.status === 'active'){ e.status = 'manual_review'; e.suggest = []; e.reason = 'Активных шагов нет: нужен план врача'; }
        const r = mkRequest(e, 'staff', 'route', 'Подтвердить маршрут', `${e.patient}${st ? ', ' + lc(DEMO[st.kind].title) : ''}. ${e.reason}.`);
        addLog(e, 'Наталья, координатор', 'Запрос врачу: подтвердить маршрут');
        state.sel.request = r.id;
        render(); toast('Запрос отправлен врачу');
      },
      nudgeDoctor(d){
        const e = ep(d.id);
        const r = mkRequest(e, 'staff', 'other', 'Нужен итог приёма', `${e.patient}: визит состоялся, а итога приёма пока нет. Без него не можем записать пациента дальше.`);
        addLog(e, 'Наталья, координатор', 'Напоминание врачу: нужен итог приёма');
        state.sel.request = r.id;
        render(); toast('Напоминание отправлено врачу');
      },
      writeOpen(d){ writeModal(d.id); },
      writeSend(d){
        const e = ep(d.id), text = $('#wrText').value.trim(), s = currentStep(e);
        if (!text){ toast('Сообщение пустое'); return; }
        state.outbox.unshift({t:'Только что', patient:e.patient, event:'Сообщение координатора', channel:'Приложение', status:'Доставлено', episodeId:e.id});
        if (e.mine) pushMsg('clinic', text, s && ['open', 'offered'].includes(s.status) ? [['Выбрать время', 'book', refKey(e, s)]] : []);
        e.callback = false;
        addLog(e, 'Наталья, координатор', 'Сообщение пациенту: ' + text);
        closeModal(); render(); toast('Сообщение отправлено');
      },
      refAdvance(d){ advanceReferral(state.referrals.find(x => x.id === d.id)); },
      refStep(d){ const [e, s] = byKey(d.key); advanceReferral(state.referrals.find(x => x.episodeId === e.id && x.stepId === s.id) || upsertReferral(e, s, 'Записан у партнёра')); },
      partnersTab(d){ state.sel.partnersTab = d.id; render(); },
      ruleToggle(d){
        state.ruleApproved[d.id] = !state.ruleApproved[d.id];
        if (state.sandbox.result) state.sandbox.result = analyze(state.sandbox.text);
        render();
        toast(state.ruleApproved[d.id] ? `Правило ${d.id} утверждено: новые заключения пойдут по нему` : `Правило ${d.id} в черновике: такие случаи уйдут на ручной разбор`);
      },
      sample(d){ state.sel.sample = d.id; state.sandbox.text = sampleText(d.id); state.sandbox.result = analyze(state.sandbox.text); render(); },
      sandboxRun(){ state.sandbox.text = $('#sbText').value; state.sandbox.result = analyze(state.sandbox.text); render(); },
      funnel(d){ state.sel.funnel = d.id; render(); },

      /* --- врач — клиника --- */
      reqOpen(d){ state.sel.request = d.id; if (state.page !== 'requests') go('requests'); else render(); },
      reqSend(d){
        const r = state.requests.find(x => x.id === d.id), i = $('#reqText'), text = i && i.value.trim();
        if (!r || !text) return;
        r.msgs.push({from:state.role === 'doctor' ? 'doctor' : 'staff', t:'Только что', text});
        render();
      },
      reqClose(d){ const r = state.requests.find(x => x.id === d.id); if (r) r.status = 'closed'; render(); toast('Запрос закрыт'); },
      reqNew(d){ reqNewModal(d.id || ''); },
      reqCreate(){
        const e = ep($('#rqEp').value), text = $('#rqText').value.trim(), topic = $('#rqTopic').value;
        if (!e || !text){ toast('Опишите, что нужно'); return; }
        const me = state.role === 'doctor' ? 'doctor' : 'staff';
        const r = mkRequest(e, me, 'other', topic, text);
        addLog(e, who(me), 'Запрос: ' + lc(topic));
        state.sel.request = r.id;
        closeModal(); go('requests'); toast('Запрос отправлен');
      },
      routeOk(d){
        const e = ep(d.id);
        if (!e || e.status !== 'manual_review') return;
        confirmRoute(e);
        render(); toast('Маршрут подтверждён. Пациент получил план, координатор — задачу на запись');
      },
      planOpen(d){ planModal(d.id, d.step || ''); },
      planSave(d){
        const e = ep(d.id), s = d.step ? stepOf(e, d.step) : null;
        const chosen = $$('[data-next]:checked').map(i => i.dataset.next);
        const rx = $('#outRx') ? $('#outRx').checked : false;
        const summary = $('#outSummary') ? ($('#outSummary').value.trim() || 'Итог внесён') : '';
        if (s && s.status === 'confirmed') attendStep(e, s);
        savePlan(e, s, chosen, rx, summary);
        closeModal(); render();
        toast(chosen.length ? 'Сохранено. Пациент видит новые шаги, координатор получил задачу на запись' : 'Сохранено. Новых шагов нет');
      }
    };

    document.addEventListener('submit', e => {
      if (e.target.id === 'intakeForm'){ e.preventDefault(); Object.assign(state, formValues()); go('review'); }
    });
    document.addEventListener('change', e => {
      const t = e.target;
      if (t.id === 'role'){ state.role = t.value; go(HOME[state.role]); return; }
      if (t.id === 'docFile'){ state.documentName = t.files && t.files[0] ? t.files[0].name : ''; toast(state.documentName ? 'Имя файла добавлено к обращению' : 'Файл не выбран'); return; }
      if (t.dataset.rule){ state.rules[t.dataset.rule] = t.checked; toast('Настройка сохранена до обновления страницы'); }
      if (t.dataset.trigger){ state.triggers[t.dataset.trigger] = t.checked; toast(t.checked ? 'Сценарий включён' : 'Сценарий выключен'); }
      if (t.dataset.notify){ state.notify[t.dataset.notify] = t.checked; toast('Настройка уведомлений сохранена'); }
    });
    document.addEventListener('input', e => {
      const t = e.target;
      if (t.id === 'slice'){
        const v = Number(t.value), k = 1 - Math.abs(v - 142) * 0.012;
        $('#sliceLabel').textContent = `Срез ${v} из 310`;
        const mark = $('#ctMark'), lungs = $('#ctLungs');
        if (mark) mark.style.display = Math.abs(v - 142) <= 3 ? '' : 'none';
        if (lungs) lungs.setAttribute('transform', `translate(180 152) scale(${k.toFixed(3)}) translate(-180 -152)`);
      }
      if (t.dataset.calc){ state.calc[t.dataset.calc] = Math.max(0, Number(t.value) || 0); $('#calcOut').innerHTML = calcOut(); }
      if (t.id === 'sbText') state.sandbox.text = t.value;
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && modal){ closeModal(); return; }
      if (e.key === 'Enter' && e.target.id === 'msgText'){ e.preventDefault(); ACTIONS.msgSend(); }
      if (e.key === 'Enter' && e.target.id === 'reqText'){ e.preventDefault(); const b = $('[data-action=reqSend]'); if (b) b.click(); }
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('clickable')){ e.preventDefault(); e.target.click(); }
    });
    document.addEventListener('click', e => {
      if (e.target.classList && e.target.classList.contains('modalshade')){ closeModal(); return; }
      if (mobileOpen && !e.target.closest('#sidebar') && !e.target.closest('.mobilemenu')){ mobileOpen = false; renderShell(); }
      const t = e.target.closest('[data-nav],[data-action],[data-scenario],[data-channel],[data-case],[data-jump]');
      if (!t) return;
      const d = t.dataset;
      if (d.nav){ go(d.nav); return; }
      if (d.jump){
        const [role, page, tab] = d.jump.split(':');
        state.role = role;
        if (page === 'pharmacy' && tab) state.sel.pharmTab = tab;
        if (page === 'partners' && tab) state.sel.partnersTab = tab;
        if (page === 'appointments') state.sel.slotTab = 'all';
        go(page); return;
      }
      if (d.scenario){
        const x = scenarios[d.scenario];
        if (x.direct === 'upload'){ ACTIONS.uploadOpen(); return; }
        if (x.direct === 'pharmacy'){ state.sel.pharmTab = 'otc'; go('pharmacy'); return; }
        if (state.page === 'home') clearIntake();
        else if ($('#intakeForm')) Object.assign(state, formValues());
        state.scenario = d.scenario; go('intake'); return;
      }
      if (d.channel){ state.channel = d.channel; render(); return; }
      if (d.case){ state.sel.episode = d.case; go('case'); return; }
      const fn = ACTIONS[d.action];
      if (fn) fn(d, t);
    });

    render();
  </script>
</body>
</html>
