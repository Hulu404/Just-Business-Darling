<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>МедМаршрут — интерактивный прототип, версия 2</title>
  <style>
    /* ---------- Основа из первой версии прототипа ---------- */
    :root{--ink:#152d32;--muted:#64787c;--green:#087f72;--green2:#12a68e;--blue:#315dce;--violet:#5a3fc0;--bg:#f4f8f7;--white:#fff;--line:#dce8e6;--soft:#e9f7f3;--warn:#a76312;--warnbg:#fff3dc;--danger:#a83c3c;--dangerbg:#fff0ee;--shadow:0 18px 48px rgba(16,54,52,.08)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,Segoe UI,Arial,sans-serif}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit}
    h1,h2,h3,p{margin-top:0}
    h1{font-size:clamp(31px,4vw,49px);line-height:1.12;letter-spacing:-.04em;margin-bottom:15px}
    h2{font-size:27px;line-height:1.2;letter-spacing:-.025em;margin-bottom:9px}
    h3{font-size:18px;margin-bottom:8px}
    p{color:var(--muted)}
    .app{min-height:100vh;display:grid;grid-template-columns:256px minmax(0,1fr)}
    .sidebar{background:#103238;color:#eaf8f5;padding:25px 16px 18px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
    .brand{display:flex;align-items:center;gap:11px;padding:0 10px;font-size:20px;font-weight:800;letter-spacing:-.03em}
    .brandmark{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#12b39b,#4f7cf0);color:#fff;font-size:27px;font-weight:600;flex:none}
    .brand small{display:block;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#8cb8b2}
    .rolebox{padding:11px;border:1px solid #34555a;border-radius:14px}
    .rolebox label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#9fc0bc}
    .rolebox select{width:100%;margin-top:6px;background:#1b454b;color:white;border:1px solid #426269;border-radius:9px;padding:9px}
    .nav{display:grid;gap:3px}
    .nav button{width:100%;display:flex;align-items:center;gap:11px;background:transparent;border:0;border-radius:11px;color:#bed5d2;padding:10px 12px;text-align:left;font-weight:600}
    .nav button:hover,.nav button.active{background:#214b4f;color:#fff}
    .nav .icon{width:22px;display:grid;place-items:center;flex:none}
    .navsep{height:1px;background:#274a4f;margin:7px 10px}
    .count{margin-left:auto;min-width:21px;text-align:center;background:var(--green2);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:1px 6px}
    .sidefoot{margin-top:auto;padding:11px;color:#91b3b1;font-size:12px;line-height:1.5}
    .sidefoot button{background:none;border:0;padding:0;margin-top:7px;color:#c9ebe4;text-decoration:underline;font-size:12px}
    .main{min-width:0}
    .topbar{height:73px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,56px);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
    .topright{display:flex;gap:10px;align-items:center}
    .content{max-width:1240px;margin:auto;padding:36px clamp(20px,4vw,56px) 70px}
    .eyebrow{color:var(--green);font-weight:800;text-transform:uppercase;letter-spacing:.11em;font-size:11px;margin-bottom:11px}
    .lead{font-size:18px;max-width:700px}
    .hero{background:linear-gradient(110deg,#fff 10%,#e9f8f3 100%);border:1px solid #d6ede6;border-radius:25px;padding:36px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.3fr .7fr;gap:25px;align-items:center}
    .hero p{max-width:650px}
    .heroArt{background:#fff;border:1px solid var(--line);padding:19px;border-radius:18px;box-shadow:var(--shadow)}
    .miniRow{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
    .miniRow:last-child{border:0}
    .miniRow>span:first-child{color:var(--muted)}
    .miniRow strong{color:var(--green);text-align:right}
    .btn{border:1px solid transparent;border-radius:11px;padding:11px 17px;background:var(--green);color:#fff;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:43px;text-decoration:none}
    .btn:hover{background:#066d62}
    .btn.secondary{background:#fff;color:var(--green);border-color:#b8d7d0}
    .btn.secondary:hover{background:var(--soft)}
    .btn.ghost{background:transparent;color:var(--green)}
    .btn.ghost:hover{background:var(--soft)}
    .btn.danger{background:var(--danger)}
    .btn.small{min-height:34px;padding:7px 11px;font-size:13px}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:21px}
    .sectionhead{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:34px 0 15px}
    .sectionhead h2{margin:0}
    .grid{display:grid;gap:16px}
    .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
    .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 25px rgba(18,58,55,.035)}
    .card.clickable{cursor:pointer;transition:transform .15s,box-shadow .15s,border .15s;display:flex;flex-direction:column}
    .card.clickable:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#97cfc2}
    .card p{margin-bottom:0}
    .cardfoot{margin-top:18px;color:var(--green);font-weight:800}
    .card.clickable .cardfoot{margin-top:auto;padding-top:18px}
    .badge{display:inline-block;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;background:var(--soft);color:var(--green);white-space:nowrap}
    .badge.blue{background:#e9efff;color:var(--blue)}
    .badge.orange{background:var(--warnbg);color:var(--warn)}
    .badge.red{background:var(--dangerbg);color:var(--danger)}
    .badge.violet{background:#efeaff;color:var(--violet)}
    .badge.gray{background:#edf2f1;color:#566b6d}
    .muted{color:var(--muted)}
    .note{border-radius:14px;background:#eef6f5;padding:15px 18px;color:#40605f;border:1px solid #d8eae6;font-size:14px}
    .note.warn{background:var(--warnbg);border-color:#f1dfb7;color:#765024}
    .note.red{background:var(--dangerbg);border-color:#f2c9c4;color:#863d39}
    .pagehead{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:23px}
    .pagehead h1{font-size:clamp(28px,3.2vw,40px)}
    .pagehead .actions{margin-top:0;justify-content:flex-end;align-items:center}
    .pagehead>div:first-child{min-width:0}
    .pagehead .actions .btn,td .btn{white-space:nowrap}
    .panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow)}
    .formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .field{display:grid;gap:7px}
    .field.full{grid-column:1/-1}
    .field label{font-weight:750}
    .field small{color:var(--muted)}
    .field input:not([type=checkbox]):not([type=radio]):not([type=range]),.field select,.field textarea{width:100%;border:1px solid #cbdcda;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}
    .field textarea{resize:vertical;min-height:105px}
    .field input:not([type=checkbox]):not([type=radio]):not([type=range]):focus,.field select:focus,.field textarea:focus{border-color:var(--green2);box-shadow:0 0 0 3px #c5eee4}
    .choiceRow{display:flex;flex-wrap:wrap;gap:9px}
    .choice{border:1px solid #cbdcda;background:white;border-radius:10px;padding:10px 13px;color:var(--ink);font-weight:700;display:inline-flex;gap:8px;align-items:center}
    .choice.selected{border-color:var(--green);background:var(--soft);color:var(--green)}
    .steps{display:flex;gap:8px;align-items:center;margin-bottom:25px;color:var(--muted);font-size:13px;flex-wrap:wrap}
    .step{display:flex;gap:8px;align-items:center}
    .step b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#dce8e6;color:#557571}
    .step.on b{background:var(--green);color:white}
    .step.on{color:var(--ink);font-weight:750}
    .sep{width:24px;height:1px;background:#b9cfcb}
    .checkline{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px}
    .checkline input{margin-top:4px;accent-color:var(--green);flex:none}
    .field label.checkline,.field label.radio{font-weight:400}
    .resulttop{display:grid;grid-template-columns:1fr 320px;gap:16px}
    .resultmain{background:linear-gradient(135deg,#e7f7f1,#fff);border:1px solid #bde4d8;border-radius:20px;padding:26px}
    .resultmain strong.big{font-size:29px;letter-spacing:-.03em;line-height:1.2;display:block}
    .stack{display:grid;grid-template-columns:minmax(0,1fr);gap:15px;align-content:start}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
    .tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:9px;padding:9px 14px;font-weight:750}
    .tab.active{background:var(--green);color:#fff;border-color:var(--green)}
    .routeSteps{list-style:none;padding:0;margin:0;display:grid;gap:12px}
    .routeSteps li{display:flex;gap:12px;align-items:start}
    .routeSteps b{display:grid;place-items:center;flex:none;width:25px;height:25px;border-radius:8px;background:var(--soft);color:var(--green)}
    .slot{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)}
    .slot:last-child{border-bottom:0}
    .slot>div:first-child{flex:1;min-width:0}
    .slot strong{display:block}
    .slot .meta{font-size:13px;color:var(--muted)}
    .slotprice{font-weight:850;color:var(--ink);white-space:nowrap}
    .tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}
    table{border-collapse:collapse;width:100%;min-width:650px}
    th,td{text-align:left;padding:15px 17px;border-bottom:1px solid var(--line);vertical-align:top}
    th{background:#f6faf9;color:#5d7877;font-size:12px;text-transform:uppercase;letter-spacing:.07em}
    tr:last-child td{border:0}
    td small{display:block;color:var(--muted)}
    .metric{font-size:31px;font-weight:850;line-height:1.2}
    .empty{text-align:center;padding:55px 20px;color:var(--muted)}
    .toast{position:fixed;right:22px;bottom:22px;background:#173c3e;color:#fff;padding:13px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:60;max-width:360px}
    .mobilemenu{display:none}
    .modalshade{position:fixed;inset:0;background:#0e2d32a6;display:grid;place-items:center;z-index:50;padding:15px;overflow:auto}
    .modal{background:#fff;border-radius:18px;padding:25px;max-width:560px;width:100%;box-shadow:0 24px 80px #1238;max-height:calc(100vh - 30px);overflow:auto}
    .modal.wide{max-width:720px}
    .modalhead{display:flex;justify-content:space-between;align-items:start;gap:10px}
    .xbtn{border:0;background:#eff5f3;border-radius:8px;width:32px;height:32px;font-size:22px;line-height:1;flex:none}
    .twocol{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;align-items:start}
    .bar{height:10px;background:#e9f0ef;border-radius:0 5px 5px 0;overflow:hidden}
    .bar i{display:block;height:100%;background:var(--green);border-radius:0 4px 4px 0}

    /* ---------- Новое во второй версии ---------- */
    .ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .btn .ic{width:17px;height:17px}
    .tile{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--soft);color:var(--green);margin-bottom:14px}
    .tile .ic{width:23px;height:23px}
    .tile.blue{background:#e9efff;color:var(--blue)}
    .tile.violet{background:#efeaff;color:var(--violet)}
    .chips{display:flex;flex-wrap:wrap;gap:7px}
    .chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;color:#48686a}
    .chip b{color:var(--ink);font-weight:750}
    button.chip{cursor:pointer;font-weight:700;padding:7px 13px;font-size:13px}
    button.chip.selected{background:var(--soft);border-color:var(--green);color:var(--green)}
    mark{background:#fdf1c7;color:inherit;border-radius:4px;padding:0 3px}
    .quote{border-left:3px solid #bfe1d8;background:#f7fbfa;border-radius:0 10px 10px 0;padding:12px 15px;color:#2d4a4d;font-size:14.5px}
    .kv{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:9px 14px;font-size:14px;margin:0}
    .kv dt{color:var(--muted)}
    .kv dd{margin:0;font-weight:650}
    .plain{color:var(--ink);font-size:16px;margin-bottom:0}
    .explain{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:22px;align-items:start}
    .viewer{background:#0b1a1f;border-radius:16px;padding:12px;color:#9fc0c2}
    .viewer svg{display:block;width:100%;height:auto;border-radius:10px}
    .viewer .cap{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-top:9px}
    .viewer input[type=range]{width:100%;accent-color:#19c8ad;margin-top:10px}
    .study{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
    .finding{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px}
    .finding input{margin-top:4px;accent-color:var(--green)}
    .finding small{display:block;color:var(--muted)}
    .board{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;align-items:start}
    .col{background:#e8f1ef;border-radius:16px;padding:12px}
    .col h3{font-size:14px;display:flex;justify-content:space-between;gap:8px;margin:3px 4px 11px}
    .col h3 span{color:var(--muted);font-weight:700}
    .kcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;color:var(--ink)}
    .kcard:hover{border-color:#97cfc2;box-shadow:0 6px 18px rgba(18,58,55,.07)}
    .kcard strong{display:block}
    .kcard span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
    .kcard .badge{margin-top:8px;display:inline-block}
    .colempty{color:var(--muted);font-size:13px;padding:6px 4px 10px}
    .chat{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
    .msg{max-width:86%;border:1px solid var(--line);background:#fff;border-radius:16px 16px 16px 5px;padding:12px 15px;justify-self:start}
    .msg.me{justify-self:end;background:var(--soft);border-color:#c5e8de;border-radius:16px 16px 5px 16px}
    .msg.new{border-color:#8fd0c1;box-shadow:0 0 0 3px #e1f5ef}
    .msg .when{font-size:12px;color:var(--muted);margin-bottom:3px}
    .msg p{color:var(--ink);margin:0}
    .msg .actions{margin-top:10px}
    .composer{display:flex;gap:9px;margin-top:18px}
    .composer input,.composer textarea{flex:1;border:1px solid #cbdcda;border-radius:10px;padding:11px 12px;min-width:0;outline:none}
    .composer input:focus,.composer textarea:focus{border-color:var(--green2);box-shadow:0 0 0 3px #c5eee4}
    .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}
    .product{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px}
    .product .tile{margin-bottom:8px}
    .product small{color:var(--muted)}
    .product .price{font-weight:850;font-size:17px;margin:10px 0 9px}
    .product .btn,.product .qty{margin-top:auto}
    .qty{display:inline-flex;align-items:center;gap:10px;font-weight:800}
    .qty button{width:34px;height:34px;border-radius:9px;border:1px solid #b8d7d0;background:#fff;color:var(--green);font-weight:800;font-size:17px;line-height:1}
    .tlgroup{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:#5d7877;margin:18px 0 12px}
    .tlgroup:first-child{margin-top:0}
    .tlitem{display:grid;grid-template-columns:22px 1fr;gap:13px;padding-bottom:17px;position:relative}
    .tlitem:before{content:"";position:absolute;left:10px;top:24px;bottom:0;width:2px;background:#dcebe7}
    .tlitem.last:before{display:none}
    .tlitem.last{padding-bottom:0}
    .dot{width:22px;height:22px;border-radius:50%;border:2px solid #b9d6cf;background:#fff;display:grid;place-items:center;color:#fff;z-index:1;margin-top:1px}
    .dot .ic{width:13px;height:13px;stroke-width:3}
    .dot.done{background:var(--green);border-color:var(--green)}
    .dot.now{border-color:var(--green);box-shadow:0 0 0 4px #d9f1ea}
    .dot.bad{border-color:var(--danger);box-shadow:0 0 0 4px var(--dangerbg)}
    .tlhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .tlmeta{font-size:13.5px;color:var(--muted);margin-top:3px}
    .tlitem .actions{margin-top:10px}
    .log{display:grid;gap:10px;font-size:13.5px}
    .log div{display:grid;grid-template-columns:96px 1fr;gap:10px}
    .log time{color:var(--muted)}
    .log b{font-weight:750}
    .split{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;align-items:start}
    .reqitem{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;color:var(--ink)}
    .reqitem:hover{border-color:#97cfc2}
    .reqitem.active{border-color:var(--green);box-shadow:0 0 0 3px #d9f1ea}
    .reqitem strong{display:block;margin:6px 0 2px}
    .reqitem span.sub{display:block;color:var(--muted);font-size:13px}
    details.more{margin-top:18px}
    details.more summary{cursor:pointer;color:var(--green);font-weight:750}
    details.more .quote{margin-top:11px}
    .flow{display:grid;grid-template-columns:1fr 34px 1.5fr 34px 1fr;gap:10px;align-items:center}
    .flowcol{display:grid;gap:9px;align-content:start}
    .flowhead{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:#5d7877;margin-bottom:3px}
    .node{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-weight:700;font-size:14px}
    .node small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:2px}
    .nodehead{display:flex;gap:8px;align-items:flex-start}
    .core{background:#e7f5f1;border:1px solid #c3e5db;border-radius:18px;padding:15px}
    .core .node{border-color:#bfe1d8}
    .node b.num{display:grid;place-items:center;width:21px;height:21px;border-radius:7px;background:var(--green);color:#fff;font-size:12px;flex:none}
    .pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .arrow{color:#7fa9a2;font-size:24px;text-align:center;font-weight:700}
    .down{color:#7fa9a2;text-align:center;line-height:1;font-weight:700}
    .calc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end}
    .calcout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
    .calcout>div{background:#f3faf8;border:1px solid #d3ebe4;border-radius:14px;padding:15px}
    .calcout span{display:block;color:var(--muted);font-size:13px}
    .trig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .trig .checkline{background:#fff}
    .funnelrow{margin-bottom:18px}
    .funnelrow:last-child{margin-bottom:0}
    .funnelrow .miniRow{border:0;padding:0 0 7px}
    .funnelrow .miniRow span{color:var(--ink);font-weight:750;font-variant-numeric:tabular-nums}
    .funnelrow .miniRow strong{color:var(--ink)}
    .cartbar{position:sticky;bottom:14px;margin-top:18px;background:#173c3e;color:#fff;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;gap:14px;align-items:center;box-shadow:var(--shadow)}
    .cartbar .btn{background:#fff;color:var(--green)}
    .rowline{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
    .rowline:last-child{border-bottom:0}
    .rowline .meta{font-size:13px;color:var(--muted)}
    .rowline>div:first-child{flex:1;min-width:0}
    .steplist{list-style:none;margin:0;padding:0;display:grid;gap:7px}
    .steplist li{display:flex;justify-content:space-between;gap:14px;font-weight:750;font-size:17px}
    .steplist li span{color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap}

    let mobileOpen = false, modal = null, seq = 200, toastTimer = null;

    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];
    const safe = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const rub = n => Number(n).toLocaleString('ru-RU') + ' ₽';
    const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; };
    /* Первая буква в строчную, если слово не аббревиатура (КТ, УЗИ, МРТ остаются как есть) */
    const uc = s => s ? s[0].toUpperCase() + s.slice(1) : s;
    const lc = s => (s && s.length > 1 && s[1] === s[1].toLowerCase() && s[1] !== s[1].toUpperCase()) ? s[0].toLowerCase() + s.slice(1) : s;
    const badge = (text, tone = '') => `<span class="badge ${tone}">${safe(text)}</span>`;
    const btn = (label, action, kind = '', data = {}) => `<button class="btn ${kind}" data-action="${action}"${Object.entries(data).map(([k, v]) => ` data-${k}="${safe(v)}"`).join('')}>${label}</button>`;
    const navBtn = (label, page, kind = '') => `<button class="btn ${kind}" data-nav="${page}">${label}</button>`;

    function toast(msg){
      $('#toast').innerHTML = `<div class="toast" role="status">${safe(msg)}</div>`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { $('#toast').innerHTML = ''; }, 3800);
    }
    function openModal(html, wide){ modal = {html, wide}; renderModal(); }
    function closeModal(){ modal = null; renderModal(); }
    function renderModal(){
      $('#overlay').innerHTML = modal ? `<div class="modalshade"><div class="modal ${modal.wide ? 'wide' : ''}" role="dialog" aria-modal="true">${modal.html}</div></div>` : '';
    }
    const modalHead = (eyebrow, title) => `<div class="modalhead"><div>${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}<h2>${title}</h2></div><button class="xbtn" data-action="close" aria-label="Закрыть">×</button></div>`;
    function go(page){ state.page = page; mobileOpen = false; modal = null; render(); window.scrollTo(0, 0); }

    /* ---------- Доменные функции: эпизод, шаги, заключение ---------- */
    const ep = id => state.episodes.find(e => e.id === id);
    const stepOf = (e, id) => e && e.steps.find(s => s.id === id);
    const studyOf = e => state.studies.find(s => s.id === e.studyId);
    const title = s => (SERVICES[s.service] || {title:s.service}).title;
    const myEpisodes = () => state.episodes.filter(e => e.mine);
    const live = s => !['completed', 'superseded'].includes(s.status);
    const currentStep = e => e.steps.find(live) || null;
    const slotLine = slot => slot ? `${slot.date}, ${slot.time}` : '';
    const slotFull = slot => slot ? `${slot.date}, ${slot.time} · ${slot.who} · ${slot.place}` : '';
    const refKey = (e, s) => `${e.id}:${s.id}`;
    function byKey(key){ const [eid, sid] = String(key || '').split(':'); const e = ep(eid); return [e, stepOf(e, sid)]; }
    function wherePartner(s){
      if (s.slot) return s.slot.partner || null;
      const list = slotsFor(s.service);
      return list.every(x => x.partner) ? list[0].partner : null;
    }
    const whereBadge = s => { const p = wherePartner(s); return p ? badge('Партнёр: ' + PARTNERS[p].name, 'violet') : ''; };

    function addLog(e, who, text){ e.log.push({t:'Только что', who, text}); }
    function pushMsg(from, text, actions){ state.messages.push({id:'m' + (++seq), from, t:'Только что', text, actions:actions || [], unread:from === 'clinic'}); }
    /* Сообщение пациенту от клиники: попадает в журнал отправок, а демо-пациенту ещё и в переписку */
    function notify(e, event, text, actions){
      state.outbox.unshift({t:'Только что', patient:e.patient, event, channel:'Приложение', status:'Доставлено', episodeId:e.id});
      if (e.mine) pushMsg('clinic', text, actions);
    }
    function mkStep(e, service, cycle, by, due){
      const s = {id:e.id + 's' + (e.steps.length + 1), cycle, service, status:'open', due:due || '', by, slot:null};
      e.steps.push(s);
      return s;
    }
    function upsertReferral(e, s, status){
      let r = state.referrals.find(x => x.episodeId === e.id && x.stepId === s.id);
      if (!r){ r = {id:'rf' + (++seq), patient:e.patient, service:s.service, partner:wherePartner(s), status, episodeId:e.id, stepId:s.id}; state.referrals.unshift(r); }
      else { r.status = status; r.partner = wherePartner(s) || r.partner; }
      return r;
    }
    function resume(e){ e.callback = false; if (e.status === 'paused'){ e.status = 'active'; e.reason = ''; } }

    function bookStep(e, s, slot, actor){
      s.status = 'confirmed'; s.slot = slot; s.overdue = false; resume(e);
      addLog(e, actor === 'patient' ? 'Пациент' : 'Наталья, координатор', `${actor === 'patient' ? 'Запись из личного кабинета' : 'Запись по звонку'}: ${title(s)} — ${lc(slotLine(slot))}`);
      if (slot.partner) upsertReferral(e, s, 'Записан у партнёра');
      notify(e, 'Подтверждение записи', `Вы записаны: ${lc(title(s))}, ${lc(slotLine(slot))}, ${slot.place}.${slot.partner ? ' Направление и заключение уже у партнёра.' : ''}`, [['Открыть план', 'nav', 'plan']]);
    }
    function offerStep(e, s, slot){
      s.status = 'offered'; s.slot = slot; resume(e);
      addLog(e, 'Наталья, координатор', `Предложено время: ${title(s)} — ${lc(slotLine(slot))}`);
      notify(e, 'Предложена запись', `Предлагаем время: ${lc(title(s))}, ${lc(slotLine(slot))}, ${slot.place}. Подходит?`, [['Подтвердить', 'accept', refKey(e, s)], ['Другое время', 'book', refKey(e, s)]]);
    }
    function attendStep(e, s){ s.status = 'attended'; addLog(e, 'Регистратура', 'Визит состоялся: ' + title(s)); }
    function unbookStep(e, s, who){
      const ref = state.referrals.find(r => r.episodeId === e.id && r.stepId === s.id && r.status === 'Записан у партнёра');
      if (ref){
        if (partnerOnly(s.service)) ref.status = 'Ожидает записи';
        else state.referrals = state.referrals.filter(r => r !== ref);
      }
      addLog(e, who, `Запись отменена: ${title(s)} — ${lc(slotLine(s.slot))}`);
      s.status = 'open'; s.slot = null;
    }
    function refuseStep(e, s, reason){
      s.status = 'refused'; e.status = 'paused'; e.reason = reason;
      addLog(e, 'Пациент', 'Отложил шаг «' + title(s) + '»: ' + lc(reason));
    }
    function reopenStep(e, s, who){
      s.status = 'open'; s.slot = null; resume(e); e.status = 'active'; e.reason = '';
      addLog(e, who, 'Шаг возвращён в работу: ' + title(s));
    }
    function closeRequests(e, kind, text){
      state.requests.forEach(r => {
        if (r.episodeId === e.id && r.status === 'open' && (!kind || r.kind === kind)){
          r.msgs.push({from:'doctor', t:'Только что', text});
          r.status = 'closed';
        }
      });
    }
    function mkRequest(e, from, kind, subject, text){
      const r = {id:'r' + (++seq), episodeId:e.id, from, kind, subject, status:'open', t:'Только что', msgs:[{from, t:'Только что', text}]};
      state.requests.unshift(r);
      state.sel.request = r.id;
      return r;
    }
    const waitingOn = r => r.msgs[r.msgs.length - 1].from === 'staff' ? 'doctor' : 'staff';

    function createPrescription(e){
      const p = {id:'rx' + (++seq), number:'77-0' + seq, patient:e.patient, mine:!!e.mine, doctor:'А. Соколова, терапевт', date:'Сегодня', valid:'60 дней', items:[['Препарат Б', 'таблетки, 14 шт.'], ['Препарат В', 'порошок для раствора, 10 пакетиков']], status:'issued', pharmacy:null, code:null, episodeId:e.id};
      state.prescriptions.unshift(p);
      return p;
    }

    /* Врач сохранил итог приёма или план: новые шаги появляются только отсюда */
    function savePlan(e, s, chosen, rx, summary){
      if (s){ s.status = 'completed'; s.outcome = summary; addLog(e, 'Врач', 'Итог приёма: ' + summary); }
      const cycle = e.steps.length ? Math.max(...e.steps.map(x => x.cycle)) + 1 : 1;
      const opts = NEXT[e.ruleId] || NEXT.own;
      chosen.forEach(sv => { const o = opts.find(x => x[0] === sv); mkStep(e, sv, cycle, 'Решение врача', o ? o[1] : ''); });
      const names = chosen.map(sv => SERVICES[sv].title);
      if (chosen.length){
        e.status = 'active'; e.reason = '';
        addLog(e, 'Врач', 'Следующие шаги: ' + names.map(lc).join('; '));
        closeRequests(e, 'route', 'План задан: ' + names.map(lc).join('; ') + '.');
        mkRequest(e, 'doctor', 'book', 'Записать на следующие шаги', `${e.patient}: ${names.map(lc).join('; ')}. Сроки указаны в плане.`);
      } else if (!e.steps.some(live)){
        e.status = 'completed';
        addLog(e, 'Врач', 'Следующих шагов нет: план выполнен');
        closeRequests(e, null, 'Следующих шагов нет, план выполнен.');
      }
      let text = chosen.length ? 'Врач обновил ваш план: ' + names.map(lc).join('; ') + '.' : 'Врач внёс итог приёма. Новых шагов нет.';
      const actions = [['Открыть план', 'nav', 'plan']];
      if (rx){ const p = createPrescription(e); addLog(e, 'Врач', 'Выписан электронный рецепт № ' + p.number); text += ' Рецепт уже в разделе «Аптека».'; actions.push(['К рецепту', 'rxTab', '']); }
      notify(e, 'План обновлён после приёма', text, actions);
    }
    function confirmRoute(e){
      const rule = RULES.find(r => r.id === e.ruleId);
      (e.suggest || []).forEach(sv => mkStep(e, sv, 1, 'Решение врача', rule ? rule.due : ''));
      e.status = 'active'; e.reason = '';
      const names = (e.suggest || []).map(sv => lc(SERVICES[sv].title)).join('; ');
      addLog(e, 'Врач', 'Маршрут подтверждён: ' + names);
      closeRequests(e, 'route', 'Подтверждаю: ' + names + '.');
      const first = e.steps.find(live);
      notify(e, 'План готов', 'Врач подтвердил следующий шаг: ' + names + '. Выберите удобное время.', first ? [['Выбрать время', 'book', refKey(e, first)]] : []);
    }

    /* ---------- Разбор заключения: демо на ключевых словах ---------- */
    function detectModality(t){
      if (/маммограф/i.test(t)) return 'mg';
      if (/МРТ|МР-признак/i.test(t)) return 'mri';
      if (/(^|[^А-Яа-яЁё])КТ([^А-Яа-яЁё]|$)|компьютерн/.test(t)) return 'ct';
      if (/рентген/i.test(t)) return 'xray';
      return null;
    }
    function extractFacts(t, modality, rule){
      const facts = [];
      if (modality) facts.push(['Исследование', MOD_LABEL[modality]]);
      const area = /молочн/i.test(t) ? 'молочная железа' : /колен/i.test(t) ? 'коленный сустав' : /лёгк|легк|грудн/i.test(t) ? 'лёгкие' : '';
      const right = /(^|[^а-яё])прав(ой|ого|ом|ая|ое|ый|ую)/i.test(t), left = /(^|[^а-яё])лев(ой|ого|ом|ая|ое|ый|ую)/i.test(t);
      if (area) facts.push(['Область', area + (right && !left ? ', справа' : left && !right ? ', слева' : '')]);
      if (rule) facts.push(['Находка', lc(rule.finding)]);
      const size = t.match(/(\d+(?:[.,]\d+)?)\s*мм/);
      if (size && rule && rule.id !== 'NORM') facts.push(['Размер', size[1] + ' мм']);
      return facts;
    }
    function analyze(text, hint){
      const t = String(text || '');
      const modality = hint || detectModality(t);
      const norm = RULES[0].test.test(t);
      const rule = norm ? RULES[0] : (RULES.find(r => r.id !== 'NORM' && (!modality || r.modality === modality) && r.test.test(t)) || null);
      return {modality, rule, approved:rule ? !!state.ruleApproved[rule.id] : false, facts:extractFacts(t, modality, rule)};
    }
    const MARK = /(инфильтр[а-яё]*(?:\s+лёгочной\s+ткани)?|очаг[а-яё]*|уплотнени[а-яё]*|мениск[а-яё]*|не\s+выявлено|\d+(?:[.,]\d+)?\s*мм)/gi;
    const highlight = text => safe(text).replace(MARK, '<mark>$1</mark>').replace(/\n+/g, '<br>');

    /* Врач подтвердил заключение: создаём эпизод и маршрут */
    function createEpisodeFromStudy(st){
      const d = DEMO[st.kind];
      const res = analyze(st.conclusion, d.modality);
      if (res.rule && res.rule.id === 'NORM'){
        st.noRoute = true;
        state.outbox.unshift({t:'Только что', patient:st.patient, event:'Результат: изменений не найдено, напоминание через 12 месяцев', channel:'Приложение', status:'Доставлено', episodeId:null});
        if (st.mine) pushMsg('clinic', 'Результат готов: изменений, которые требуют действий, на снимке не нашли. О плановом обследовании напомним через 12 месяцев.', [['Что на снимке', 'nav', 'imaging']]);
        return null;
      }
      const e = {id:'e' + (++seq), patient:st.patient, mine:!!st.mine, kind:'imaging', studyId:st.id, title:d.title, opened:'Только что', status:'active', reason:'', ruleId:res.rule ? res.rule.id : null,
        profile:st.uploaded ? ['47 лет', 'Полис ДМС', 'Снимок загружен пациентом'] : ['Данные карты придут из МИС'], steps:[], log:[]};
      addLog(e, 'Д. Ершов', 'Заключение подтверждено врачом' + (st.edited ? ', черновик ИИ исправлен' : ''));
      if (res.rule && res.approved){
        res.rule.steps.forEach(sv => mkStep(e, sv, 1, `Правило ${res.rule.id}, версия ${res.rule.version}`, res.rule.due));
        const names = res.rule.steps.map(sv => lc(SERVICES[sv].title)).join('; ');
        addLog(e, 'Маршрутизатор', `Следующий шаг по правилу ${res.rule.id}: ${names}, срок ${res.rule.due}`);
        notify(e, 'Заключение готово: объяснение и запись', `${d.ready}. Врач подтвердил заключение. Следующий шаг: ${names}, срок ${res.rule.due}.`, [['Что на снимке', 'nav', 'imaging'], ['Выбрать время', 'book', refKey(e, e.steps[0])]]);
      } else {
        e.status = 'manual_review';
        e.suggest = res.rule ? res.rule.steps.slice() : [];
        e.reason = res.rule ? `Правило ${res.rule.id} ещё не утверждено клиникой: нужен план врача` : 'Для такой находки правила нет: нужен план врача';
        addLog(e, 'Маршрутизатор', e.reason);
        mkRequest(e, 'staff', 'route', 'Подтвердить маршрут', `${e.patient}, ${lc(d.title)}. ${e.reason}.${e.suggest.length ? ' Вариант маршрутизатора: ' + e.suggest.map(sv => lc(SERVICES[sv].title)).join('; ') + '.' : ''}`);
        notify(e, 'Заключение готово: план уточняет врач', `${d.ready}. Врач подтвердил заключение и сейчас уточняет следующий шаг. Мы напишем, когда план будет готов.`, [['Что на снимке', 'nav', 'imaging']]);
      }
      state.episodes.unshift(e);
      st.episodeId = e.id;
      return e;
    }

    /* Очередь координатора: что мешает эпизоду двигаться */
    function queueInfo(e){
      if (e.status === 'completed') return {label:'Завершено', tone:'gray', reason:'План выполнен', group:'done', need:false};
      if (e.status === 'closed') return {label:'Остановлено', tone:'gray', reason:e.reason || 'Сопровождение остановлено', group:'done', need:false};
      if (e.status === 'manual_review') return {label:'Ручной разбор', tone:'orange', reason:e.reason || 'Нужен план врача', group:'lost', need:true};
      if (e.status === 'paused') return {label:'Отложено', tone:'red', reason:'Пациент отложил шаг: ' + lc(e.reason || 'причина не указана'), group:'lost', need:true};
      const cur = e.steps.filter(live);
      const over = cur.find(s => s.overdue);
      if (over) return {label:'Просрочено', tone:'red', reason:`Срок прошёл ${over.due}, пациент не записан`, group:'lost', need:true};
      if (e.callback) return {label:'Перезвонить', tone:'orange', reason:'Пациент просит перезвонить', group:'offer', need:true};
      const att = cur.find(s => s.status === 'attended');
      if (att && att.slot && att.slot.partner) return {label:'У партнёра', tone:'blue', reason:'Услуга у партнёра оказана, ждём результат', group:'outcome', need:true};
      if (att) return {label:'Ждёт итога врача', tone:'blue', reason:'Визит состоялся, итога приёма пока нет', group:'outcome', need:true};
      const open = cur.find(s => s.status === 'open');
      if (open) return {label:'Не записан', tone:'orange', reason:'Пациент не выбрал время' + (open.due ? '. Срок: ' + open.due : ''), group:'offer', need:true};
      const off = cur.find(s => s.status === 'offered');
      if (off) return {label:'Ждём ответ', tone:'blue', reason:'Предложено время: ' + lc(slotLine(off.slot)) + '. Пациент ещё не ответил', group:'wait', need:true};
      const conf = cur.find(s => s.status === 'confirmed');
      if (conf) return {label:'Записан', tone:'', reason:`Ждём визита: ${lc(slotLine(conf.slot))}`, group:'booked', need:false};
      return {label:'В работе', tone:'', reason:'Активных шагов нет', group:'booked', need:false};
    }
    const awaitingOutcome = () => state.episodes.flatMap(e => e.steps.filter(s => s.status === 'attended' && !(s.slot && s.slot.partner)).map(s => [e, s]));

    /* ---------- Каркас: меню, шапка, отрисовка ---------- */
    const NAVS = {
      patient:[['home','home','Главная'],['plan','route','Мой план'],['imaging','scan','Что на снимке'],['appointments','calendar','Записи'],['messages','message','Сообщения'],['pharmacy','pharmacy','Аптека'],['documents','doc','Документы']],
      staff:[['inbox','inbox','Обращения'],['scheduling','clock','Запись и сопровождение'],['requests','doctor','Связь с врачами'],['comms','message','Связь с пациентами'],['partners','link','Партнёры'],['pharmacyAdmin','pharmacy','Аптека и заказы'],['rules','sliders','Маршруты и правила'],['analytics','bars','Аналитика']],
      doctor:[['reading','scan','Что на снимке'],['doctor','calendar','Приёмы'],['requests','message','Связь с клиникой'],['inbox','inbox','Обращения']]
    };
    const HOME = {patient:'home', staff:'inbox', doctor:'reading'};
    const roleName = () => state.role === 'patient' ? 'Пациент' : state.role === 'staff' ? 'Клиника' : 'Врач';
    function navCount(id){
      if (state.role === 'patient'){
        if (id === 'messages') return state.messages.filter(m => m.unread).length;
        if (id === 'pharmacy') return Object.values(state.cart).reduce((a, b) => a + b, 0);
      }
      if (state.role === 'staff'){
        if (id === 'inbox') return state.episodes.filter(e => queueInfo(e).need).length;
        if (id === 'requests') return state.requests.filter(r => r.status === 'open' && waitingOn(r) === 'staff').length;
        if (id === 'pharmacyAdmin') return state.orders.filter(o => o.status === 'Собирается').length;
      }
      if (state.role === 'doctor'){
        if (id === 'reading') return state.studies.filter(s => s.status === 'awaiting').length;
        if (id === 'doctor') return awaitingOutcome().length;
        if (id === 'requests') return state.requests.filter(r => r.status === 'open' && waitingOn(r) === 'doctor').length;
      }
      return 0;
    }
    function pageTitle(){
      const t = {home:'Главная', intake:'Новое обращение', review:'Проверка данных', result:'Ваш МедМаршрут', plan:'Мой план', imaging:'Что на снимке', appointments:'Записи', messages:'Сообщения', pharmacy:'Аптека', documents:'Документы', inbox:'Обращения', case:'Карточка обращения', scheduling:'Запись и сопровождение', requests:state.role === 'doctor' ? 'Связь с клиникой' : 'Связь с врачами', comms:'Связь с пациентами', partners:'Партнёры', pharmacyAdmin:'Аптека и заказы', rules:'Маршруты и правила', analytics:'Аналитика', reading:'Что на снимке', study:'Снимок и заключение', doctor:'Приёмы', services:'Карта сервисов'};
      return t[state.page] || 'МедМаршрут';
    }
    function renderShell(){
      const nav = NAVS[state.role] || NAVS.patient;
      const parent = {case:'inbox', study:state.role === 'patient' ? 'imaging' : 'reading'}[state.page] || state.page;
      const item = ([id, ic, label]) => { const n = navCount(id); return `<button data-nav="${id}" class="${parent === id ? 'active' : ''}"><span class="icon">${icon(ic)}</span>${label}${n ? `<span class="count">${n}</span>` : ''}</button>`; };
      $('#sidebar').className = 'sidebar' + (mobileOpen ? ' open' : '');
      $('#sidebar').innerHTML = `<div class="brand"><span class="brandmark">+</span><div>МедМаршрут<small>Прототип · версия 2</small></div></div>

      $('#topbar').innerHTML = `<div style="display:flex;align-items:center;gap:12px"><button class="mobilemenu" data-action="menu" aria-label="Меню">${icon('menu')}</button><strong>${safe(pageTitle())}</strong></div><div class="topright">${badge(roleName())}<span class="muted hidem" style="font-size:13px">Демо-режим</span></div>`;

    function render(){
      const fn = PAGES[state.page] || PAGES[HOME[state.role]];

    /* =====================================================================
       Экраны пациента
       ===================================================================== */
    const P_STATUS = {open:['Нужно записаться','orange'], offered:['Клиника предложила время','blue'], confirmed:['Вы записаны',''], attended:['Ждём итог врача','blue'], completed:['Выполнено','gray'], refused:['Отложено','red'], superseded:['Заменён','gray']};
    const REASONS = ['Уже есть запись в другой клинике', 'Нет удобного времени', 'Дорого', 'Хочу сначала обсудить с врачом', 'Другая причина'];
    const ROOMS = {therapist:'кабинет 214 на втором этаже', gp:'кабинет 214 на втором этаже', therapist2:'кабинет 214 на втором этаже', attending:'кабинет 214 на втором этаже', pulmo:'кабинет 216 на втором этаже', labs:'процедурный кабинет 105 на первом этаже', xray2:'кабинет рентгена 118 на первом этаже', usbreast:'кабинет УЗИ 207 на втором этаже', mammolog:'кабинет 209 на втором этаже', ortho:'кабинет 301 на третьем этаже', ortho2:'кабинет 301 на третьем этаже'};

    /* Что пациенту делать по эпизоду прямо сейчас */
    function patientNext(e){
      const s = currentStep(e);
      if (e.urgent) return {head:'Обратитесь за срочной помощью', text:'Вы отметили тревожный признак. Не ждите плановой записи: позвоните 103 или 112.', buttons:'<a class="btn danger" href="tel:103">Позвонить 103</a><a class="btn secondary" href="tel:112">Позвонить 112</a>'};
      if (e.status === 'manual_review') return {head:'Врач уточняет следующий шаг', text:'Мы напишем, как только план будет готов. Обычно это занимает до двух часов.', buttons:''};
      if (e.status === 'completed') return {head:'План выполнен', text:'Новых шагов нет. Если что-то изменится, напишите координатору.', buttons:navBtn('Написать в клинику', 'messages', 'secondary')};
      if (e.status === 'closed') return {head:'Сопровождение остановлено', text:e.reason || '', buttons:''};
      if (!s) return {head:'Активных шагов нет', text:'', buttons:''};
      const key = refKey(e, s), p = wherePartner(s);
      if (s.status === 'refused') return {head:title(s), text:'Вы отложили этот шаг. Координатор свяжется с вами, а вернуться к записи можно в любой момент.', buttons:btn('Вернуться к записи', 'reopen', '', {key})};
      if (s.status === 'open') return {head:title(s), text:`${s.overdue ? 'Срок прошёл ' + s.due : s.due ? 'Срок: ' + s.due : 'Выберите удобное время'}. ${p ? 'Услугу оказывает клиника-партнёр: направление и заключение передадим сами.' : 'Ближайшее время: ' + lc(slotLine(slotsFor(s.service)[0])) + '.'}`, buttons:btn('Выбрать время', 'book', '', {key}) + btn('Не сейчас', 'later', 'ghost', {key})};
      if (s.status === 'offered') return {head:title(s), text:`Клиника предлагает: ${lc(slotFull(s.slot))}.`, buttons:btn('Подтвердить', 'accept', '', {key}) + btn('Другое время', 'book', 'secondary', {key}) + btn('Не сейчас', 'later', 'ghost', {key})};
      if (s.status === 'confirmed') return {head:title(s), text:`Вы записаны: ${lc(slotFull(s.slot))}.`, buttons:btn('Перенести', 'book', 'secondary', {key}) + btn('Отменить запись', 'unbook', 'ghost', {key})};
      if (s.status === 'attended') return {head:title(s), text:'Визит состоялся. Врач вносит итог, после этого план обновится.', buttons:''};
      return {head:title(s), text:'', buttons:''};
    }

    function patientHero(){
      const base = {h1:'Поможем понять,<br>что делать дальше', lead:'Расскажите о своей ситуации. Мы поможем подготовиться к обращению и найти подходящий путь к специалисту.', buttons:btn('Начать обращение →', 'new') + btn('Как это работает', 'how', 'secondary'), artTitle:'Ваш будущий план', art:[['Следующий шаг', 'Понятно'], ['Запись', 'С реальными слотами'], ['Подготовка', 'В одном месте']]};
      const e = myEpisodes().find(x => x.kind === 'imaging' && !['completed', 'closed'].includes(x.status));
      if (!e) return base;
      const st = studyOf(e), d = DEMO[st.kind], s = currentStep(e);
      if (e.status === 'manual_review') return {h1:d.ready, lead:'Врач подтвердил заключение и сейчас уточняет следующий шаг. Мы напишем, как только план будет готов.', buttons:navBtn('Что на снимке →', 'imaging') + navBtn('Открыть план', 'plan', 'secondary'), artTitle:'Ваш следующий шаг', art:[['Что сделать', 'Пока ничего'], ['Кто решает', 'Врач клиники'], ['Обычно занимает', 'До двух часов']]};
      if (!s) return base;
      const key = refKey(e, s);
      if (s.status === 'refused') return {h1:'Запись отложена', lead:`Вы отложили шаг «${lc(title(s))}». Вернуться к нему можно в любой момент.`, buttons:btn('Вернуться к записи', 'reopen', '', {key}) + navBtn('Открыть план', 'plan', 'secondary'), artTitle:'Отложенный шаг', art:[['Что сделать', title(s)], ['Срок', uc(s.due) || 'По плану']]};
      if (s.status === 'open') return {h1:s.cycle === 1 ? d.ready : 'Врач обновил ваш план', lead:s.cycle === 1 ? `Врач подтвердил заключение ${st.confirmedAt}. Мы объяснили его простыми словами и подобрали следующий шаг.` : 'После приёма появились новые шаги. Запишитесь на ближайший.', buttons:(s.cycle === 1 ? navBtn('Что на снимке →', 'imaging') : navBtn('Открыть план →', 'plan')) + btn('Выбрать время', 'book', 'secondary', {key}), artTitle:'Ваш следующий шаг', art:[['Что сделать', title(s)], ['Срок', uc(s.due) || 'По плану'], ['Ближайшее время', slotLine(slotsFor(s.service)[0])]]};
      if (s.status === 'offered') return {h1:'Клиника предложила время', lead:`${title(s)}: ${lc(slotFull(s.slot))}.`, buttons:btn('Подтвердить', 'accept', '', {key}) + btn('Другое время', 'book', 'secondary', {key}), artTitle:'Ваш следующий шаг', art:[['Что сделать', 'Подтвердить запись'], ['Когда', slotLine(s.slot)], ['Где', s.slot.place]]};
      if (s.status === 'confirmed') return {h1:'Вы записаны', lead:`${title(s)}: ${lc(slotFull(s.slot))}.`, buttons:navBtn('Открыть план →', 'plan') + navBtn('Что на снимке', 'imaging', 'secondary'), artTitle:'Ближайший визит', art:[['Когда', slotLine(s.slot)], ['Где', s.slot.place], ['С собой', 'Паспорт и полис']]};
      return {h1:'Приём состоялся', lead:'Врач вносит итог приёма. Как только план обновится, мы напишем.', buttons:navBtn('Открыть план →', 'plan'), artTitle:'Ваш следующий шаг', art:[['Что сделать', 'Пока ничего'], ['Кто решает', 'Лечащий врач']]};
    }

    function home(){
      const h = patientHero();
      const unread = state.messages.filter(m => m.unread).length;
      const rx = state.prescriptions.filter(p => p.mine && p.status === 'issued').length;
      const pair = myEpisodes().map(e => [e, currentStep(e)]).find(x => x[1] && !['completed', 'closed'].includes(x[0].status));
      const planText = pair ? `${title(pair[1])} — ${lc(P_STATUS[pair[1].status][0])}` : 'Активных шагов нет';
      return `<section class="hero"><div><div class="eyebrow">Клиника «Линия здоровья»</div><h1>${h.h1}</h1><p class="lead">${h.lead}</p><div class="actions">${h.buttons}</div></div><div class="heroArt"><div class="eyebrow">${h.artTitle}</div>${h.art.map(([k, v]) => `<div class="miniRow"><span>${k}</span><strong>${safe(v)}</strong></div>`).join('')}</div></section>
        <div class="sectionhead"><h2>Сейчас у вас</h2></div>
        <div class="grid three">
          <article class="card clickable" tabindex="0" role="button" data-nav="plan"><div class="tile">${icon('route')}</div><h3>Мой план</h3><p>${safe(planText)}</p><div class="cardfoot">Открыть план →</div></article>
          <article class="card clickable" tabindex="0" role="button" data-nav="messages"><div class="tile blue">${icon('message')}</div><h3>Сообщения</h3><p>${unread ? `${unread} ${plural(unread, ['новое', 'новых', 'новых'])} от клиники` : 'Новых сообщений нет'}</p><div class="cardfoot">Открыть переписку →</div></article>
          <article class="card clickable" tabindex="0" role="button" data-nav="pharmacy"><div class="tile violet">${icon('pharmacy')}</div><h3>Аптека</h3><p>${rx ? `${rx} ${plural(rx, ['рецепт ждёт', 'рецепта ждут', 'рецептов ждут'])} получения` : 'Товары без рецепта и бронь по рецепту'}</p><div class="cardfoot">Перейти в аптеку →</div></article>
        </div>
        <div class="sectionhead"><h2>С чем помочь?</h2>${h.buttons.includes('data-action="how"') ? '<span class="muted">Выберите ситуацию</span>' : btn('Как это работает', 'how', 'ghost small')}</div>
        <div class="grid three">${Object.entries(scenarios).map(([id, x]) => `<article class="card clickable" tabindex="0" role="button" data-scenario="${id}"><div class="tile">${icon(x.icon)}</div><h3>${x.title}</h3><p>${x.desc}</p><div class="cardfoot">Продолжить →</div></article>`).join('')}</div>
        <div class="note" style="margin-top:20px">Сервис помогает организовать обращение. Если ситуация требует срочной помощи, обратитесь в экстренные службы по номерам 103 или 112.</div>`;
    }

    /* ---------- Что на снимке ---------- */
    function patientStudy(st){
      const d = DEMO[st.kind];
      const head = (b, tone) => `${badge(b, tone)}<h2 style="margin-top:11px">${d.title}</h2><p>${safe(st.source)} · ${safe(st.date)}${st.file ? ` · файл «${safe(st.file)}»` : ''}</p>`;
      if (st.status === 'processing' || st.status === 'awaiting'){
        const stage = st.status === 'processing' ? 1 : 2;
        const names = ['Файлы приняты', 'ИИ готовит черновик', 'Врач проверяет', 'Результат и план'];
        return `<div class="panel">${head(st.status === 'processing' ? 'Обрабатывается' : 'Ждёт врача', 'blue')}<div class="steps" style="margin:18px 0 14px">${names.map((n, i) => `${i ? '<span class="sep"></span>' : ''}<span class="step ${i <= stage ? 'on' : ''}"><b>${i + 1}</b>${n}</span>`).join('')}</div><p style="margin:0">${st.status === 'processing' ? 'Проверяем файлы и готовим черновик заключения.' : 'Черновик готов, его проверяет врач-рентгенолог. Результат и план появятся здесь, а мы пришлём сообщение. Обычно это занимает до двух часов.'}</p></div>`;
      }
      if (st.status === 'manual') return `<div class="panel">${head('Врач описывает сам', 'orange')}<p style="margin:0">Врач решил описать этот снимок без черновика ИИ. Заключение появится здесь, и мы пришлём сообщение.</p></div>`;
      const e = st.episodeId ? ep(st.episodeId) : null;
      const nx = st.noRoute ? {head:'Сейчас ничего делать не нужно', text:'Напомним о плановом обследовании через 12 месяцев.', buttons:''} : e ? patientNext(e) : {head:'', text:'', buttons:''};
      return `<div class="panel">${head('Подтверждено врачом')}
        <div class="explain">
          <div class="viewer">${SCHEME[d.scheme](d.findings.length > 0)}<div class="cap"><span>${d.findings.length ? 'Схема: где врач отметил изменение' : 'Схема снимка'}</span><span>Не медицинское изображение</span></div></div>
          <div class="stack">
            <div><div class="eyebrow">Что увидели</div><p class="plain">${d.seen}</p></div>
            <div><div class="eyebrow">Что это значит</div><p class="plain">${d.means}</p></div>
            <div class="resultmain" style="padding:20px"><div class="eyebrow">Что дальше</div><strong style="font-size:20px">${safe(nx.head)}</strong><p style="margin:7px 0 0">${safe(nx.text)}</p>${nx.buttons ? `<div class="actions" style="margin-top:14px">${nx.buttons}</div>` : ''}</div>
          </div>
        </div>
        <details class="more"><summary>Заключение врача полностью</summary><div class="quote">${safe(st.conclusion).replace(/\n+/g, '<br>')}<br><br><span class="muted">${safe(st.confirmedBy)}, подтверждено ${safe(st.confirmedAt)}</span></div></details>
      </div>`;
    }
    function imaging(){
      const list = state.studies.filter(s => s.mine);
      return `<div class="pagehead"><div><div class="eyebrow">Сервис «Что на снимке?»</div><h1>Мои исследования</h1><p>Заключение появляется здесь после того, как его подтвердил врач. Рядом — объяснение простыми словами и следующий шаг.</p></div><div class="actions">${btn(icon('plus') + 'Загрузить снимок', 'uploadOpen')}</div></div>
        <div class="stack">${list.map(patientStudy).join('') || '<div class="panel empty"><h3>Исследований пока нет</h3><p>Загрузите снимок или заключение из другой клиники.</p></div>'}</div>
        <div class="note" style="margin-top:18px">ИИ не ставит диагноз. Он помогает врачу описать снимок, а нам — подобрать следующий шаг. Заключение всегда подтверждает врач. Объяснения в демо условные: в продукте их тексты утверждает клиника.</div>`;
    }
    function uploadModal(){
      openModal(`${modalHead('Сервис «Что на снимке?»', 'Загрузить снимок или заключение')}
        <p>Подойдёт исследование из другой клиники. ИИ подготовит черновик, врач его проверит, и вы получите объяснение и план.</p>
        <div class="field"><label for="upKind">Что за исследование</label><select id="upKind"><option value="xray">Рентгенография</option><option value="ct">КТ</option><option value="mg">Маммография</option><option value="mri">МРТ</option></select></div>
        <div class="field" style="margin-top:14px"><label for="upFile">Файл</label><input id="upFile" type="file" accept=".zip,.dcm,.pdf,image/*"><small>Архив DICOM, PDF или фото заключения. В демо файл никуда не отправляется: сохраняется только его имя.</small></div>
        <label class="checkline" style="margin-top:14px"><input type="checkbox" id="upConsent"><span>Разрешаю передать исследование врачу клиники «Линия здоровья» для описания</span></label>
        <div class="actions">${btn('Отправить врачу', 'upload')}${btn('Отмена', 'close', 'secondary')}</div>`);
    }

    /* ---------- Мой план ---------- */
    function visitDay(s){
      if (!s.slot) return '';
      if (s.slot.format === 'Онлайн') return '<strong>В день визита.</strong> Ссылка на видеоприём придёт сюда и в SMS за 15 минут до начала.';
      if (s.slot.partner) return `<strong>В день визита.</strong> ${safe(PARTNERS[s.slot.partner].name)} — партнёр клиники. Направление и заключение уже там, с собой нужен только паспорт. Результат вернётся в ваш план.`;
      return `<strong>В день визита.</strong> ${safe(s.slot.place)}: регистратура на первом этаже, затем ${ROOMS[s.service] || 'кабинет укажем в напоминании'}. Приходите за 10 минут, с собой паспорт и полис.${s.service === 'labs' ? ' Как подготовиться к анализам, напишем в напоминании.' : ''}`;
    }
    function planStep(e, s, isCur, isLast){
      const [lab, tone] = s.overdue && s.status === 'open' ? ['Срок прошёл', 'red'] : P_STATUS[s.status];
      const dot = s.status === 'completed' ? `<span class="dot done">${icon('check')}</span>` : `<span class="dot ${s.status === 'refused' || s.overdue ? 'bad' : isCur ? 'now' : ''}"></span>`;
      const meta = [];
      if (s.slot) meta.push(safe(slotFull(s.slot)) + (s.slot.price ? ' · ' + s.slot.price : ''));
      else if (s.due) meta.push((s.overdue ? 'Срок прошёл ' : 'Срок: ') + safe(s.due));
      if (s.outcome) meta.push('Итог приёма: ' + safe(s.outcome));
      const key = refKey(e, s);
      let acts = '';
      if (!isCur && e.status === 'active'){
        if (s.status === 'open') acts = btn('Выбрать время', 'book', 'secondary small', {key});
        if (s.status === 'offered') acts = btn('Подтвердить', 'accept', 'small', {key}) + btn('Другое время', 'book', 'secondary small', {key});
        if (s.status === 'confirmed') acts = btn('Перенести', 'book', 'secondary small', {key}) + btn('Отменить', 'unbook', 'ghost small', {key});
      }
      return `<div class="tlitem ${isLast ? 'last' : ''}">${dot}<div><div class="tlhead"><strong>${title(s)}</strong>${badge(lab, tone)}${whereBadge(s)}</div><div class="tlmeta">${meta.join('<br>')}</div>${s.status === 'confirmed' ? `<div class="note" style="margin-top:10px">${visitDay(s)}</div>` : ''}${acts ? `<div class="actions">${acts}</div>` : ''}</div></div>`;
    }
    function planEpisode(e){
      const st = e.kind === 'imaging' ? studyOf(e) : null;
      const nx = patientNext(e), cur = currentStep(e);
      const [lab, tone] = e.urgent ? ['Нужна срочная помощь', 'red'] : {active:['В работе', ''], manual_review:['Врач уточняет план', 'orange'], paused:['Отложено', 'red'], completed:['План выполнен', 'gray'], closed:['Остановлено', 'gray']}[e.status];
      const shown = e.steps.filter(s => s.status !== 'superseded');
      let rows = `<div class="tlitem ${shown.length ? '' : 'last'}"><span class="dot done">${icon('check')}</span><div><div class="tlhead"><strong>${st ? 'Исследование и заключение' : 'Обращение заполнено'}</strong></div><div class="tlmeta">${st ? `${DEMO[st.kind].title} · заключение подтвердил ${safe(st.confirmedBy)}` : 'Ответы из анкеты переданы в клинику'}</div>${st ? `<div class="actions">${navBtn('Что на снимке', 'imaging', 'ghost small')}</div>` : ''}</div></div>`;
      let cycle = 0;
      shown.forEach((s, i) => {
        if (s.cycle !== cycle){ cycle = s.cycle; rows += `<div class="tlgroup">Этап ${cycle} · ${cycle === 1 ? (st ? 'после исследования' : 'по вашему обращению') : 'после приёма врача'}</div>`; }
        rows += planStep(e, s, cur === s, i === shown.length - 1);
      });
      return `<div class="panel" style="margin-bottom:18px">
        <div class="pagehead" style="margin-bottom:16px"><div>${badge(lab, tone)}<h2 style="margin-top:11px">${safe(e.title)}</h2><p style="margin:0">${st ? 'Маршрут после исследования' : 'Маршрут по вашему обращению'} · открыт ${lc(e.opened)}</p></div></div>
        <div class="resultmain" style="margin-bottom:22px"><div class="eyebrow">Следующий шаг</div><strong class="big">${safe(nx.head)}</strong>${nx.text ? `<p style="margin:11px 0 0">${safe(nx.text)}</p>` : ''}${nx.buttons ? `<div class="actions">${nx.buttons}</div>` : ''}</div>
        <div class="tlgroup">Что уже сделано и что впереди</div>${rows}
      </div>`;
    }
    function plan(){
      const mine = myEpisodes();
      return `<div class="pagehead"><div><div class="eyebrow">Ваше сопровождение</div><h1>Мой план</h1><p>Все шаги после исследования и приёма в одном месте: в клинике и у партнёров.</p></div><div class="actions">${btn('Новое обращение', 'new')}</div></div>
        ${mine.length ? mine.map(planEpisode).join('') : `<div class="empty panel"><h2>Пока нет активного маршрута</h2><p>Начните с описания ситуации.</p>${btn('Создать маршрут', 'new')}</div>`}`;
    }

    /* ---------- Записи ---------- */
    function bookable(){
      const out = [];
      myEpisodes().forEach(e => {
        if (['completed', 'closed', 'manual_review'].includes(e.status)) return;
        e.steps.forEach(s => { if (['open', 'offered', 'refused'].includes(s.status) || (s.status === 'confirmed' && state.sel.book === refKey(e, s))) out.push([e, s]); });
      });
      return out;
    }
    function appointments(){
      const list = bookable();
      const cur = list.find(([e, s]) => refKey(e, s) === state.sel.book) || list[0];
      const booked = myEpisodes().flatMap(e => e.steps.filter(s => s.status === 'confirmed').map(s => [e, s]));
      const head = `<div class="pagehead"><div><div class="eyebrow">Расписание клиники и партнёров</div><h1>Выбрать запись</h1><p>Слоты здесь вымышленные. В рабочем продукте они приходят из расписания клиники и клиник-партнёров.</p></div></div>`;
      const bookedHtml = booked.map(([e, s]) => `<div class="note" style="margin-bottom:12px"><strong>Вы записаны:</strong> ${lc(title(s))} — ${lc(safe(slotFull(s.slot)))}. ${btn('Перенести', 'book', 'ghost small', {key:refKey(e, s)})}${btn('Отменить', 'unbook', 'ghost small', {key:refKey(e, s)})}</div>`).join('');
      if (!cur) return head + bookedHtml + `<div class="panel empty"><h3>Сейчас записываться не на что</h3><p>Новые шаги появятся после приёма или нового исследования.</p>${navBtn('Открыть мой план', 'plan', 'secondary')}</div>`;
      const [e, s] = cur, key = refKey(e, s), tab = state.sel.slotTab;
      const all = slotsFor(s.service);
      const shown = all.filter(x => tab === 'all' || (tab === 'own' && !x.partner && x.format !== 'Онлайн') || (tab === 'partner' && x.partner) || (tab === 'online' && x.format === 'Онлайн'));
      const chooser = list.length > 1 ? `<div class="field" style="margin-bottom:16px"><label>На что записываемся</label><div class="choiceRow">${list.map(([e2, s2]) => `<button class="choice ${s2 === s ? 'selected' : ''}" data-action="book" data-key="${refKey(e2, s2)}">${title(s2)}</button>`).join('')}</div></div>` : '';
      return head + bookedHtml + chooser + `<div class="twocol"><div class="panel"><h2>${title(s)}</h2><p>${s.overdue ? 'Срок прошёл ' + safe(s.due) : s.due ? 'Срок: ' + safe(s.due) : 'Выберите удобное время'}${s.status === 'confirmed' ? ' · сейчас вы записаны: ' + lc(slotLine(s.slot)) : ''}</p>
          <div class="tabs">${[['all', 'Все'], ['own', 'Наша клиника'], ['partner', 'Клиники-партнёры'], ['online', 'Онлайн']].map(([id, label]) => `<button class="tab ${tab === id ? 'active' : ''}" data-action="slotTab" data-id="${id}">${label}</button>`).join('')}</div>
          ${shown.map(x => `<div class="slot"><div><strong>${x.date}, ${x.time}</strong><div>${x.who}</div><div class="meta">${x.place} · ${x.format}</div>${x.partner ? `<div style="margin-top:6px">${badge('Клиника-партнёр', 'violet')}</div>` : ''}${s.status === 'offered' && s.slot && s.slot.id === x.id ? `<div style="margin-top:6px">${badge('Предложено клиникой', 'blue')}</div>` : ''}</div><div class="slotprice">${x.price}</div>${btn('Выбрать', 'slotAsk', 'small', {key, slot:x.id, mode:'patient'})}</div>`).join('') || '<p style="margin:14px 0 0">В этом разделе свободного времени нет. Посмотрите вкладку «Все».</p>'}
        </div>
        <div class="stack"><div class="panel"><h3>Нет подходящего времени?</h3><p>Координатор клиники проверит другие варианты, в том числе у партнёров, и свяжется с вами.</p>${btn('Попросить координатора', 'callback', 'secondary', {id:e.id})}</div><div class="note warn">При наличии тревожных признаков не ожидайте плановой записи. Для экстренной помощи: 103 или 112.</div></div></div>`;
    }
    function slotAskModal(key, slotId, mode){
      const [e, s] = byKey(key);
      const x = slotsFor(s.service).find(z => z.id === slotId);
      const heads = {patient:'Подтверждение записи', offer:'Предложить время пациенту', staff:'Записать по звонку'};
      openModal(`${modalHead(heads[mode], `${x.date}, ${x.time}`)}<p><strong style="color:var(--ink)">${title(s)}</strong><br>${x.who}<br>${x.place} · ${x.format} · ${x.price}</p>
        ${x.partner ? `<div class="note" style="margin-bottom:12px"><strong>${PARTNERS[x.partner].name}</strong> — партнёр клиники. ${mode === 'patient' ? 'Мы передадим туда направление и заключение по снимку, а результат вернётся в ваш план.' : 'Партнёр получит направление и заключение, результат вернётся в эпизод.'}</div>` : ''}
        <div class="note">${mode === 'offer' ? 'Пациент получит сообщение с кнопкой подтверждения. В демо оно появится в режиме пациента.' : 'Это демонстрационная запись. В расписание клиники она не попадает.'}</div>
        <div class="actions">${btn(mode === 'offer' ? 'Отправить предложение' : 'Подтвердить', 'slotConfirm', '', {key, slot:slotId, mode})}${btn('Назад', 'close', 'secondary')}</div>`);
    }
    function laterModal(key){
      const [, s] = byKey(key);
      openModal(`${modalHead('Отложить шаг', title(s))}<p>Подскажите, что мешает записаться. Координатор увидит причину и предложит другой вариант.</p>
        ${REASONS.map((r, i) => `<label class="radio"><input type="radio" name="reason" value="${r}" ${i === 1 ? 'checked' : ''}><span>${r}</span></label>`).join('')}
        <div class="actions">${btn('Отправить', 'laterSend', '', {key})}${btn('Назад', 'close', 'secondary')}</div>`);
    }

    /* ---------- Сообщения ---------- */
    function messages(){
      const fresh = new Set(state.messages.filter(m => m.unread).map(m => m.id));
      state.messages.forEach(m => { m.unread = false; });
      const bubble = m => `<div class="msg ${m.from === 'patient' ? 'me' : ''} ${fresh.has(m.id) ? 'new' : ''}"><div class="when">${m.from === 'patient' ? 'Вы' : 'Клиника «Линия здоровья»'} · ${safe(m.t)}</div><p>${safe(m.text)}</p>${m.actions.length ? `<div class="actions">${m.actions.map(([label, kind, arg], i) => `<button class="btn ${i ? 'secondary' : ''} small" data-action="msgAct" data-kind="${kind}" data-arg="${safe(arg)}">${label}</button>`).join('')}</div>` : ''}</div>`;
      const n = state.notify;
      return `<div class="pagehead"><div><div class="eyebrow">Связь с клиникой</div><h1>Сообщения</h1><p>Клиника пишет, когда готов результат, пора записаться или изменился план. Ответить можно прямо здесь.</p></div></div>
        <div class="twocol"><div class="panel"><div class="chat">${state.messages.map(bubble).join('')}</div>
            <div class="composer"><input id="msgText" placeholder="Напишите координатору" autocomplete="off">${btn('Отправить', 'msgSend')}</div></div>
          <div class="stack"><div class="panel"><h3>Как вам писать</h3>
              ${[['app', 'В приложении'], ['sms', 'SMS'], ['messenger', 'В мессенджере'], ['quiet', 'Не беспокоить с 21:00 до 9:00']].map(([id, label]) => `<label class="checkline" style="margin-bottom:9px"><input type="checkbox" data-notify="${id}" ${n[id] ? 'checked' : ''}><span>${label}</span></label>`).join('')}
            </div>
            <div class="panel"><h3>Ваш координатор</h3><p>Наталья. Отвечает с 8:00 до 20:00, обычно в течение часа.</p>${btn('Перезвоните мне', 'callback', 'secondary', {id:(myEpisodes()[0] || {}).id || ''})}</div>
            <div class="note">В демо сообщения никуда не уходят. Ответ координатора можно написать в режиме сотрудника клиники.</div></div></div>`;
    }

    /* ---------- Аптека ---------- */
    const cartCount = () => Object.values(state.cart).reduce((a, b) => a + b, 0);
    const cartTotal = () => Object.entries(state.cart).reduce((a, [id, q]) => a + PRODUCTS.find(p => p.id === id).price * q, 0);
    const RX_STATUS = {issued:['Не получен', 'orange'], reserved:['Забронирован', 'blue'], done:['Получен', 'gray']};
    function pharmacyOtc(){
      const cat = state.sel.cat, n = cartCount();
      const items = PRODUCTS.filter(p => cat === 'all' || p.cat === cat);
      return `<div class="chips" style="margin-bottom:16px">${CATS.map(([id, label]) => `<button class="chip ${cat === id ? 'selected' : ''}" data-action="cat" data-id="${id}">${label}</button>`).join('')}</div>
        <div class="products">${items.map(p => { const q = state.cart[p.id] || 0; return `<div class="product"><div class="tile">${icon(p.icon)}</div><strong>${p.name}</strong><small>${p.form}${p.drug ? ' · лекарство без рецепта' : ''}</small><div class="price">${rub(p.price)}</div>${q ? `<div class="qty"><button data-action="cartDec" data-id="${p.id}" aria-label="Убрать одну штуку">−</button><span>${q}</span><button data-action="cartAdd" data-id="${p.id}" aria-label="Добавить ещё">+</button></div>` : btn('В корзину', 'cartAdd', 'secondary small', {id:p.id})}</div>`; }).join('')}</div>
        ${n ? `<div class="cartbar"><span>${icon('cart')} В корзине ${n} ${plural(n, ['товар', 'товара', 'товаров'])} на ${rub(cartTotal())}</span>${btn('Оформить', 'checkoutOpen', 'small')}</div>` : ''}
        <div class="note" style="margin-top:18px">Продавец — аптека-партнёр с лицензией: МедМаршрут передаёт ей заказ и сам лекарства не продаёт. У лекарств есть противопоказания, перед применением прочитайте инструкцию или спросите врача.</div>`;
    }
    function pharmacyRx(){
      const list = state.prescriptions.filter(p => p.mine);
      if (!list.length) return `<div class="panel empty"><h3>Рецептов пока нет</h3><p>Электронный рецепт появится здесь, когда врач выпишет его на приёме.</p></div>`;
      return list.map(p => {
        const [lab, tone] = RX_STATUS[p.status];
        const ph = p.pharmacy && PHARMACIES.find(x => x.id === p.pharmacy);
        return `<div class="panel" style="margin-bottom:16px"><div class="pagehead" style="margin-bottom:14px"><div>${badge(lab, tone)}<h2 style="margin-top:11px">Рецепт № ${p.number}</h2></div></div>
          <dl class="kv"><dt>Врач</dt><dd>${safe(p.doctor)}</dd><dt>Выписан</dt><dd>${lc(p.date)}, действует ${p.valid}</dd><dt>Препараты</dt><dd>${p.items.map(([a, b]) => `${a}, ${b}`).join('<br>')}</dd></dl>
          ${p.status === 'issued' ? `<div class="tlgroup" style="margin-top:20px">Где получить</div>${PHARMACIES.map(x => `<div class="rowline"><div><strong>${x.name}</strong><div class="meta">${x.addr} · ${x.dist}</div></div><div style="text-align:right"><strong>${RX_STOCK[x.id][1]}</strong><div class="meta">${RX_STOCK[x.id][0]}</div></div>${btn('Забронировать', 'rxReserve', 'small', {id:p.id, ph:x.id})}</div>`).join('')}` : ''}
          ${p.status === 'reserved' ? `<div class="note" style="margin-top:18px"><strong>Бронь в аптеке: ${ph.name}.</strong> ${ph.addr}. Код выдачи ${p.code}, бронь держат три дня. Возьмите паспорт: препарат выдадут по рецепту.</div><div class="actions">${btn('Отменить бронь', 'rxCancel', 'ghost small', {id:p.id})}</div>` : ''}
          ${p.status === 'done' ? `<div class="note" style="margin-top:18px">Препараты получены в аптеке: ${ph ? ph.name : ''}.</div>` : ''}</div>`;
      }).join('') + `<div class="note">Рецептурные препараты аптека выдаёт только по рецепту и только в аптеке. Рецепт видит та аптека-партнёр, которую вы выбрали. Названия препаратов в демо условные.</div>`;
    }
    function pharmacyOrders(){
      const list = state.orders.filter(o => o.mine);
      if (!list.length) return `<div class="panel empty"><h3>Заказов пока нет</h3><p>Здесь появятся заказы без рецепта и брони по рецепту.</p></div>`;
      return `<div class="panel">${list.map(o => `<div class="rowline"><div><strong>${o.type === 'rx' ? 'Бронь' : 'Заказ'} ${o.id}</strong><div class="meta">${safe(o.items)} · ${safe(o.place)}</div></div><div class="slotprice">${o.total}</div>${badge(o.status, o.status === 'Выдан' ? 'gray' : o.status === 'Готов к выдаче' ? '' : 'blue')}</div>`).join('')}</div>`;
    }
    function pharmacy(){
      const tab = state.sel.pharmTab;
      const rx = state.prescriptions.filter(p => p.mine && p.status === 'issued').length;
      const mineOrders = state.orders.filter(o => o.mine).length;
      const tabs = [['otc', 'Без рецепта'], ['rx', 'По рецепту' + (rx ? ` · ${rx}` : '')], ['orders', 'Мои заказы' + (mineOrders ? ` · ${mineOrders}` : '')]];
      return `<div class="pagehead"><div><div class="eyebrow">Аптеки-партнёры</div><h1>Аптека</h1><p>Товары без рецепта можно забрать в клинике в день приёма. Рецептурные препараты — забронировать в аптеке рядом.</p></div></div>
        <div class="tabs">${tabs.map(([id, label]) => `<button class="tab ${tab === id ? 'active' : ''}" data-action="pharmTab" data-id="${id}">${label}</button>`).join('')}</div>
        ${tab === 'otc' ? pharmacyOtc() : tab === 'rx' ? pharmacyRx() : pharmacyOrders()}`;
    }
    function checkoutModal(){
      const visit = myEpisodes().flatMap(e => e.steps).find(s => s.status === 'confirmed' && s.slot && !s.slot.partner && s.slot.format !== 'Онлайн');
      const opts = [['ph0', PHARMACIES[0].name, visit ? `Заберу в день приёма: ${lc(slotLine(visit.slot))}` : 'Центральный филиал, выдача сегодня после 15:00'], ['ph1', PHARMACIES[1].name, `${PHARMACIES[1].addr} · ${PHARMACIES[1].dist}`], ['ph2', PHARMACIES[2].name, `${PHARMACIES[2].addr} · ${PHARMACIES[2].dist}`], ['delivery', 'Доставка курьером', 'Завтра с 10:00 до 14:00, 250 ₽']];
      const lines = Object.entries(state.cart).map(([id, q]) => { const p = PRODUCTS.find(x => x.id === id); return `<div class="miniRow"><span>${p.name} × ${q}</span><strong>${rub(p.price * q)}</strong></div>`; }).join('');
      openModal(`${modalHead('Заказ без рецепта', 'Как получить заказ')}${lines}<div class="miniRow"><span>Итого</span><strong>${rub(cartTotal())}</strong></div>
        <div style="margin-top:14px">${opts.map(([id, name, sub], i) => `<label class="radio"><input type="radio" name="place" value="${id}" ${i === 0 ? 'checked' : ''}><span><strong>${name}</strong><br><span class="muted">${sub}</span></span></label>`).join('')}</div>
        <div class="note">Оплата при получении. В демо заказ никуда не уходит.</div>
        <div class="actions">${btn('Оформить заказ', 'checkout')}${btn('Назад', 'close', 'secondary')}</div>`);
    }

    /* ---------- Документы ---------- */
    function documents(){
      const studies = state.studies.filter(s => s.mine && s.status === 'confirmed');
      const rx = state.prescriptions.filter(p => p.mine);
      const rows = [
        ...studies.map(s => `<div class="slot"><div><strong>Заключение: ${lc(DEMO[s.kind].title)}</strong><div class="meta">${safe(s.date)} · подтвердил ${safe(s.confirmedBy)}</div></div>${navBtn('Открыть', 'imaging', 'secondary small')}</div>`),
        ...rx.map(p => `<div class="slot"><div><strong>Рецепт № ${p.number}</strong><div class="meta">${safe(p.doctor)} · ${lc(p.date)} · действует ${p.valid}</div></div>${btn('Открыть', 'rxTab', 'secondary small')}</div>`),
        ...(state.documentName ? [`<div class="slot"><div><strong>${safe(state.documentName)}</strong><div class="meta">Добавлен к обращению из анкеты · в прототипе сохраняется только имя файла</div></div>${btn('Убрать', 'removeDoc', 'secondary small')}</div>`] : [])
      ];
      return `<div class="pagehead"><div><div class="eyebrow">Ваши материалы</div><h1>Документы</h1><p>Заключения по исследованиям, рецепты и файлы, которые вы добавили к обращению.</p></div></div>
        <div class="panel">${rows.join('') || '<div class="empty"><h3>Документов пока нет</h3><p>Добавьте документ в анкете нового обращения.</p></div>'}<div class="actions">${btn('Новое обращение с документом', 'newDocument', 'secondary')}${btn('Загрузить снимок', 'uploadOpen', 'secondary')}</div></div>`;
    }

    /* ---------- Новое обращение: анкета, проверка, маршрут (из первой версии) ---------- */
    const INTAKE = ['symptoms', 'document', 'noslots', 'after'];
    function stepbar(current){
      return `<div class="steps">${['Ситуация', 'Уточнение', 'Маршрут'].map((s, i) => `${i ? '<span class="sep"></span>' : ''}<span class="step ${i <= current ? 'on' : ''}"><b>${i + 1}</b>${s}</span>`).join('')}</div>`;
    }
    const scenarioPicker = () => `<div class="choiceRow">${INTAKE.map(id => `<button class="choice ${state.scenario === id ? 'selected' : ''}" data-scenario="${id}">${scenarios[id].title}</button>`).join('')}</div>`;
    function intake(){
      const kind = INTAKE.includes(state.scenario) ? state.scenario : 'symptoms';
      const x = scenarios[kind];
      return `<div class="pagehead"><div><div class="eyebrow">Новое обращение</div><h1>${x.title}</h1><p class="lead">Ответьте на несколько вопросов. Вы сможете проверить сведения перед отправкой в клинику.</p></div></div>${stepbar(1)}
        <div class="panel"><div class="field full"><label>Ваша ситуация</label>${scenarioPicker()}</div>
        <form id="intakeForm" style="margin-top:24px"><div class="formgrid">
          <div class="field full"><label for="symptoms">${kind === 'document' ? 'Что вы хотите понять по документу?' : kind === 'noslots' ? 'Почему нужна запись?' : kind === 'after' ? 'Что рекомендовал врач?' : 'Что вас беспокоит?'}</label><textarea id="symptoms" name="symptoms" placeholder="Напишите своими словами">${safe(state.symptoms)}</textarea><small>Можно кратко. Врач увидит исходный текст.</small></div>
          <div class="field"><label for="duration">Когда это началось?</label><input id="duration" name="duration" value="${safe(state.duration)}" placeholder="Например, неделю назад"></div>
          <div class="field"><label for="city">Город</label><input id="city" name="city" value="${safe(state.city)}" placeholder="Город"></div>
          <div class="field"><label for="age">Возрастная группа</label><select id="age" name="age"><option value="adult" ${state.age === 'adult' ? 'selected' : ''}>Взрослый</option><option value="child" ${state.age === 'child' ? 'selected' : ''}>Ребёнок</option></select></div>
          <div class="field"><label for="channel">Предпочтительный способ обращения</label><select id="channel" name="channel"><option value="private" ${state.channel === 'private' ? 'selected' : ''}>Платно</option><option value="dms" ${state.channel === 'dms' ? 'selected' : ''}>ДМС</option><option value="oms" ${state.channel === 'oms' ? 'selected' : ''}>ОМС</option></select></div>
          ${kind === 'noslots' ? `<div class="field"><label for="doctor">К какому врачу нужно попасть?</label><input id="doctor" name="doctor" value="${safe(state.doctor)}" placeholder="Например, к терапевту"></div><div class="field"><label for="wait">Когда есть ближайшая запись?</label><input id="wait" name="wait" value="${safe(state.wait)}" placeholder="Например, через две недели"></div>` : ''}
          ${kind === 'document' || kind === 'after' ? `<div class="field full"><label for="docFile">Добавить документ</label><input id="docFile" type="file" accept=".pdf,image/*"><small>${state.documentName ? `Сейчас выбран: ${safe(state.documentName)}. ` : ''}В демо файл не загружается на сервер и не распознаётся автоматически. Снимки КТ, МРТ, маммографии и рентгена удобнее загрузить в разделе «Что на снимке».</small></div>` : ''}
          <div class="field full"><label class="checkline"><input type="checkbox" name="redflag" ${state.redflag ? 'checked' : ''}><span><strong>Есть резкое ухудшение или другой тревожный признак</strong><br><span class="muted">Отметьте, если считаете, что помощь может требоваться сейчас. В реальном сервисе здесь будут проверенные вопросы.</span></span></label></div>
        </div><div class="actions"><button class="btn" type="submit">Продолжить →</button><button class="btn ghost" type="button" data-nav="home">Вернуться на главную</button></div></form></div>`;
    }
    function review(){
      return `<div class="pagehead"><div><div class="eyebrow">Шаг 2 из 3</div><h1>Проверьте данные</h1><p>Исправьте сведения, прежде чем мы составим маршрут.</p></div></div>${stepbar(1)}
        <div class="twocol"><div class="panel"><h3>Ваше обращение</h3>
            <div class="miniRow"><span>Ситуация</span><strong>${safe((scenarios[state.scenario] || scenarios.symptoms).title)}</strong></div>
            <div class="miniRow"><span>Описание</span><strong style="max-width:65%">${safe(state.symptoms || 'Не указано')}</strong></div>
            <div class="miniRow"><span>Началось</span><strong>${safe(state.duration || 'Не указано')}</strong></div>
            <div class="miniRow"><span>Город</span><strong>${safe(state.city)}</strong></div>
            <div class="miniRow"><span>Документ</span><strong>${safe(state.documentName || 'Не добавлен')}</strong></div>
            <div class="actions">${navBtn('Исправить ответы', 'intake', 'secondary')}</div></div>
          <div class="stack"><div class="panel"><h3>Что извлечено из документа?</h3><p>Для анализов и выписок распознавание в прототипе не подключено. Если нужно, вручную добавьте важные сведения для врача.</p><div class="field"><label for="documentNotes">Заметки по документу</label><textarea id="documentNotes" placeholder="Например, дата исследования и показатели, которые хотите обсудить">${safe(state.documentNotes)}</textarea></div></div>
            <div class="note">Не отправляйте реальные медицинские документы при тестировании прототипа. Сведения остаются в этой вкладке до обновления страницы.</div></div></div>
        <div class="actions">${btn('Составить маршрут →', 'createRoute')}</div>`;
    }
